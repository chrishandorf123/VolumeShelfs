        __fbOK&&__uid&&h("button",{className:"btn ghost",onClick:()=>{__auth.signOut().then(()=>location.reload())}},"SIGN OUT"))));
}
</script>

<script>
"use strict";
/* ================= APP SHELL ================= */
const MODULES=[
  {id:"board",icon:"▦",label:"BOARD"},
  {id:"dial",icon:"☎",label:"DIAL"},
  {id:"targets",icon:"◎",label:"TARGETS"},
  {id:"playbook",icon:"▤",label:"PLAYBOOK"},
  {id:"objections",icon:"⛨",label:"OBJECT"},
  {id:"messages",icon:"✉",label:"MESSAGE"},
  {id:"cadence",icon:"⛓",label:"CADENCE"},
  {id:"stats",icon:"▙",label:"STATS"},
  {id:"forge",icon:"⚒",label:"FORGE"},
];
function Andon(){
  const [,force]=useState(0);
  const [now,setNow]=useState(new Date());
  useEffect(()=>{
    const f=()=>force(x=>x+1);window.addEventListener("v5stats",f);
    const iv=setInterval(()=>setNow(new Date()),1000);
    return()=>{window.removeEventListener("v5stats",f);clearInterval(iv)};
  },[]);
  const t=todayStats();
  const cw=callWindow();
  const goal=goalPerDay(),streak=dialStreak();
  const cells=[["DIALS",t.dials],["CONNECT",t.connects],["CONVO",t.convos],["VM",t.vms||0],["BOOKED",t.meetings]];
  return h("div",{className:"andon"},
    cells.map(([l,v],i)=>h("div",{key:l,className:"andon-cell"},
      h("span",{className:"al"},l),
      h("span",{className:"av",style:l==="BOOKED"&&v>0?{color:"#3ddc84"}:null},v))),
    h("div",{className:"andon-cell",title:"Daily dial goal from your funnel math"},
      h("span",{className:"al"},"GOAL"),
      h("span",{className:"av",style:{fontSize:16,color:t.dials>=goal?"#3ddc84":"#F2F4F0"}},t.dials+"/"+goal)),
    streak>=2&&h("div",{className:"andon-cell",title:"Consecutive weekdays hitting the dial goal"},
      h("span",{className:"al"},"STREAK"),
      h("span",{className:"av",style:{color:"#f5a300"}},"🔥"+streak)),
    h("div",{className:"andon-cell",style:{minWidth:150}},
      h("span",{className:"al"},"CALL WINDOW"),
      h("span",{style:{fontFamily:"var(--mono)",fontSize:11,fontWeight:700,color:cw.c===("var(--go)")?"#3ddc84":cw.c==="var(--amber)"?"#f5a300":"#8A9099"}},"● "+cw.label)),
    h("div",{className:"andon-clock"},
      h("button",{className:"kbd",style:{cursor:"pointer",background:"transparent",color:"#8A9099"},title:"Command palette",onClick:()=>window.dispatchEvent(new Event("v5palette"))},"⌘K"),
      h("button",{className:"kbd",style:{cursor:"pointer",background:"transparent",color:"#8A9099"},title:"Hotkeys",onClick:()=>window.dispatchEvent(new Event("v5keys"))},"?"),
      h("div",{style:{textAlign:"right"}},
        h("div",{style:{fontFamily:"var(--disp)",fontWeight:900,fontSize:20,fontVariantNumeric:"tabular-nums"}},now.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})),
        h("div",{className:"al",style:{fontFamily:"var(--mono)",fontSize:8,color:"#8A9099",letterSpacing:".12em"}},now.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"}).toUpperCase()))));
}
function App(){
  const [mod,setMod]=useState("board");
  const [sub,setSub]=useState(null);
  const [nav,setNav]=useState(0);
  const [palette,setPalette]=useState(false);
  const [keys,setKeys]=useState(false);
  const [objLookup,setObjLookup]=useState(false);
  const modRef=useRef(mod);modRef.current=mod;
  /* remount the page only on a real module change or a deep link — a rail click
     on the current module must stay a no-op (e.g. mid dial session) */
  const go=(m,s)=>{setMod(m);setSub(s||null);if(s!=null||m!==modRef.current)setNav(n=>n+1);};
  useEffect(()=>{
    const p=()=>setPalette(v=>!v);
    const k=()=>setKeys(v=>!v);
    window.addEventListener("v5palette",p);window.addEventListener("v5keys",k);
    return()=>{window.removeEventListener("v5palette",p);window.removeEventListener("v5keys",k)};
  },[]);
  useHotkeys(e=>{
    if(e.key==="?"){setKeys(v=>!v);return true}
    if(e.key==="/"){setPalette(true);return true}
    if(e.key.toLowerCase()==="o"){setObjLookup(true);return true}  /* shadowed by LiveCall during a live call */
    if(/^[1-9]$/.test(e.key)){
      const m=MODULES[+e.key-1];
      if(m){go(m.id);return true}
    }
    return false;
  });
  const Page={board:TBoard,dial:TDial,targets:TTargets,playbook:TPlaybook,objections:TObjections,messages:TMessages,cadence:TCadence,stats:TStats,forge:TForge}[mod];
  return h(F,null,
    h(ToastHost),
    h("div",{className:"rail"},
      h("div",{className:"rail-logo",title:"VANTAGE"},"V"),
      MODULES.map((m,i)=>h("button",{key:m.id,className:"rail-btn"+(mod===m.id?" on":""),onClick:()=>go(m.id),title:m.label+" — key "+(i+1)},
        h("span",{className:"ri"},m.icon),
        h("span",{className:"rl"},m.label),
        h("span",{className:"rk"},i+1))),
      h("div",{className:"rail-foot"},
        h("button",{className:"btn sm ghost",style:{width:"100%",marginBottom:7},onClick:()=>setKeys(true),title:"Hotkey cheat sheet (?)"},"? KEYS"),
        h("div",{className:"mono",style:{fontSize:7.5,color:"var(--dim)",lineHeight:1.6,letterSpacing:".05em"}},"VANTAGE 5.8",h("br"),__fbOK&&__uid?"SYNCED":"LOCAL"))),
    h("div",{className:"main"},
      h(Andon),
      h(Page,{key:mod+":"+nav,go,initial:sub,initialSection:sub})),
    palette&&h(Palette,{onClose:()=>setPalette(false),go}),
    keys&&h(KeysOverlay,{onClose:()=>setKeys(false)}),
    objLookup&&h(ObjOverlay,{onClose:()=>setObjLookup(false)}));
}
/* ================= GATE + BOOT ================= */
function bootApp(){
  document.getElementById("gate").style.display="none";
  const el=document.getElementById("app");el.style.display="flex";
  loadState().then(()=>{ReactDOM.createRoot(el).render(h(App))});
}
function Gate(){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const signIn=async()=>{
    setBusy(true);setErr("");
    try{await __auth.signInWithEmailAndPassword(email.trim(),pass)}
    catch(e){
      if(e&&(e.code==="auth/user-not-found")){try{await __auth.createUserWithEmailAndPassword(email.trim(),pass)}catch(e2){setErr(e2.message||"Sign-in failed")}}
      else setErr((e&&e.message)||"Sign-in failed");
    }
    setBusy(false);
  };
  return h("div",{style:{width:380,maxWidth:"92vw"}},
    h("div",{className:"blk",style:{padding:"28px 26px"}},
      h("div",{style:{width:54,height:54,background:"var(--ink)",color:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"var(--disp)",fontWeight:900,fontSize:28,marginBottom:14}},"V"),
      h("div",{className:"disp",style:{fontSize:26,lineHeight:1}},"VANTAGE"),
      h("div",{className:"mono dim",style:{fontSize:10,letterSpacing:".12em",margin:"4px 0 18px"}},"COLD CALL COMMAND · TULIP"),
      __fbOK?h(F,null,
        h(Field,{label:"EMAIL"},h("input",{style:{width:"100%"},type:"email",value:email,onChange:e=>setEmail(e.target.value),onKeyDown:e=>e.key==="Enter"&&signIn()})),
        h(Field,{label:"PASSWORD"},h("input",{style:{width:"100%"},type:"password",value:pass,onChange:e=>setPass(e.target.value),onKeyDown:e=>e.key==="Enter"&&signIn()})),
        err&&h("div",{className:"mono",style:{fontSize:10,color:"var(--alarm)",marginBottom:10}},err),
        h("button",{className:"btn big primary",style:{width:"100%",marginBottom:10},disabled:busy,onClick:signIn},busy?"WORKING…":"SIGN IN / CREATE"),
        h("button",{className:"btn ghost",style:{width:"100%"},onClick:bootApp},"WORK OFFLINE (THIS DEVICE ONLY)"))
      :h(F,null,
        h("div",{className:"mono dim",style:{fontSize:10.5,lineHeight:1.7,marginBottom:14}},"Cloud sync unavailable in this environment — running in local mode. Everything works; data stays on this device."),
        h("button",{className:"btn big primary",style:{width:"100%"},onClick:bootApp},"▶ ENTER VANTAGE"))),
    h("div",{className:"mono dim",style:{fontSize:8.5,textAlign:"center",marginTop:12,letterSpacing:".1em"}},"DIALS TODAY · MEETINGS NEXT QUARTER — THE 30-DAY RULE"));
}
(function init(){
  const gateEl=document.getElementById("gate");
  const renderGate=()=>ReactDOM.createRoot(gateEl).render(h(Gate));
  if(__fbOK){
    let settled=false;
    __auth.onAuthStateChanged(u=>{
      if(u){__uid=u.uid;settled=true;bootApp()}
      else if(!settled){settled=true;renderGate()}
    });
    setTimeout(()=>{if(!settled){settled=true;renderGate()}},2500);
  } else renderGate();
})();
</script>
</body>
</html>
