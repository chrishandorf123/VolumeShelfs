63eb"},{"id":"meddicc","cat":"qualification","name":"MEDDICC","full":"Metrics · Economic Buyer · Decision Criteria · Decision Process · Identify Pain · Champion · Competition","origin":"MEDDIC + Competition layer","stage":"Discovery → Proposal → Close","when":"Competitive deals. When you know 2+ vendors are being evaluated, or when status quo is the main alternative.","desc":"Adds Competition to MEDDIC. In manufacturing MES, you're almost always competing against paper/Excel, a legacy system, or an internal IT build. Pull your battle cards.","letters":[{"l":"M","n":"Metrics","d":"Quantified business outcomes tied to buyer KPIs.","q":"Tulip metrics to lead with: 448% ROI, $16.23M NPV, 70% fewer defects, 15% labor productivity, $1 in → $10 out."},{"l":"E","n":"Economic Buyer","d":"Who controls the budget and has final authority? Have you met them?","q":"Is there a CFO, COO, or VP who would need to approve this? What does their annual scorecard look like?"},{"l":"D","n":"Decision Criteria","d":"Technical, business, and relationship criteria. Surface what could eliminate you.","q":"Are there must-haves that could eliminate a vendor? [GxP compliance? SAP integration? No-code?]"},{"l":"D","n":"Decision Process","d":"Steps from evaluation to signature. Who's on the selection committee?","q":"After you narrow the field, what comes next. POC, security review, legal, procurement? How long does each step take?"},{"l":"I","n":"Identify Pain","d":"The core business problem driving urgency right now.","q":"What's the operational pain that's forcing a decision now. versus why this wasn't a priority before?"},{"l":"C","n":"Champion","d":"Internal advocate with credibility and skin in the game.","q":"Is your champion comfortable going to leadership and saying 'I recommend Tulip'? What's in it for them personally?"},{"l":"C","n":"Competition","d":"Named competitors and status quo. Must have a strategy for each one.","q":"Are you evaluating other solutions, or is the current process the main alternative? [Pull battle card for each named competitor]"}],"apply":"When competition is named, immediately pull the battle card. Lead with win themes first, then neutralize their strengths.","tip":"Status quo (paper/Excel) is your #1 competitor in manufacturing. Price it: 'What's it costing you to stay where you are?' Most buyers have never calculated it.","color":"#7c3aed"},{"id":"meddpicc","cat":"qualification","name":"MEDDPICC","full":"Metrics · Economic Buyer · Decision Criteria · Decision Process · Paper Process · Identify Pain · Champion · Competition","origin":"MEDDIC evolution. enterprise SaaS standard","stage":"Discovery → Proposal → Close → Signature","when":"Enterprise deals $100K+ ACV with formal procurement, legal review, and security cycles.","desc":"Adds Paper Process (procurement/legal/security) to MEDDICC. In manufacturing, IT security reviews and ERP integration validation can add 60–90 days after verbal agreement. Map this early or it will kill your Q4. Use the Scorecard in Tools to track every deal.","letters":[{"l":"M","n":"Metrics","d":"Quantified outcomes tied to what the buyer's leadership scores them on.","q":"Tulip metrics: 448% ROI, $16.23M NPV, 70% fewer defects, 15% labor productivity, $318K vendor consolidation."},{"l":"E","n":"Economic Buyer","d":"Budget authority. Often COO, VP Ops, or CFO in manufacturing. Have you met them?","q":"Have you connected the EB to this initiative? What's their #1 priority this fiscal year?"},{"l":"D","n":"Decision Criteria","d":"Explicit requirements. In mfg: GxP, ERP integration, no-code, scalability, security.","q":"Does your team have a formal requirements list? What are the absolute deal-breakers?"},{"l":"D","n":"Decision Process","d":"Evaluation timeline and gates: demo → POC → selection → procurement.","q":"Who's on the selection committee? What are the gates between stages?"},{"l":"P","n":"Paper Process","d":"Everything after selection: MSA, DPA, security questionnaire, PO. Often takes longer than the sale.","q":"What does procurement look like after a vendor is selected? IT security review? Legal review? How long does each typically take?"},{"l":"I","n":"Identify Pain","d":"Specific, consequential pain with a dollar cost attached.","q":"What's the cost of a quality escape, failed audit, or production delay? Hours/week lost to paper and manual reporting?"},{"l":"C","n":"Champion","d":"Internal advocate who owns the outcome and has personal motivation.","q":"Does your champion know what's in it for them personally if this project succeeds? Career win? Less firefighting?"},{"l":"C","n":"Competition","d":"Named competitors and status quo. Strategy required for each.","q":"Who else are you looking at? What's working well with your current approach that we'd need to match or beat?"}],"apply":"Score deals 0–8 before AE handoff. Missing P (Paper Process) = deal will slip your forecast quarter. Ask about procurement on call #2, not call #10.","tip":"73% of SaaS companies over $100K ACV use MEDDPICC. It's the language your AEs speak. Brief your AE with MEDDPICC scores after every booked meeting.","color":"#0891b2"},{"id":"spin","cat":"selling","name":"SPIN Selling","full":"Situation · Problem · Implication · Need-Payoff","origin":"Neil Rackham, 1988. 35,000 sales calls analyzed at Huthwaite","stage":"Discovery Calls","when":"Every discovery call. The single best question framework for surfacing and developing pain. Use P and I heavily.","desc":"Research-backed: top performers ask more Implication and Need-Payoff questions, far fewer Situation questions. The goal is to help buyers feel the full weight of their problem. then feel the relief of solving it. They sell themselves.","letters":[{"l":"S","n":"Situation","d":"Context questions. Do your research first. don't waste call time on things you can find on LinkedIn.","q":"'How are you currently tracking production steps and work instructions on the floor?' [Minimal. you should already know most of this.]"},{"l":"P","n":"Problem","d":"Surface specific pains. Get them talking. Listen for emotion, not just facts.","q":"'Where do you see the most rework or quality escapes in your process? What's the most frustrating part of your current system?'"},{"l":"I","n":"Implication","d":"MOST IMPORTANT. Deepen the pain. Make the cost of the problem visceral and real. This is where deals are won.","q":"'What happens downstream when a quality escape slips through? What's the impact on customers, audits, your team?' [Let them feel the full cost.]"},{"l":"N","n":"Need-Payoff","d":"Help the buyer articulate the value of solving the problem. They say it. you don't.","q":"'If you had real-time visibility into every step and caught defects the moment they happen. what would that mean for your results?'"}],"apply":"The ratio: spend 10% on S, 30% on P, 40% on I, 20% on N. Most SDRs over-invest in S and never get to I. Implication is where the emotional buy happens.","tip":"Best Need-Payoff openers: 'If you could..' / 'What would it mean if..' / 'How valuable would it be if..' Let them answer. then tie it to a Tulip case study.","color":"#2563eb"},{"id":"challenger","cat":"selling","name":"Challenger Sale","full":"Teach · Tailor · Take Control","origin":"Matt Dixon & Brent Adamson, CEB/Gartner, 2011. 6,000 reps researched","stage":"Discovery → Proposal","when":"Prospects complacent about status quo. When you need to create urgency that doesn't exist yet.","desc":"53% of customer loyalty comes from the quality of the sales experience. not the product. Challengers win by teaching buyers something new about their business and guiding them to the ideal solution rather than responding to stated needs.","letters":[{"l":"1","n":"Teach","d":"Lead with a unique insight the buyer hasn't heard. Reframe their problem through your lens.","q":"'Most manufacturers think their ERP handles shop floor ops. What we actually see is a 2-layer gap between the ERP and the floor where tribal knowledge, rework, and compliance risk live. That's the gap Tulip was built for.'"},{"l":"2","n":"Tailor","d":"Customize your insight for their specific industry, role, and what they're measured on.","q":"Pharma: 21 CFR Part 11 + eBR. A&D: ITAR, DCMA, AS9100. Discrete: OEE, throughput, NPI cycle time. Each persona hears a different version."},{"l":"3","n":"Take Control","d":"Drive the conversation to a decision. Challenge complacency directly.","q":"'That's actually where our best customers were 12 months before an audit or quality escape made the cost of staying put undeniable. What would that look like for you?'"}],"apply":"Your Challenger opener: 'The #1 thing we hear from plant managers is that their ERP tells them what happened. Tulip tells them what's happening right now.'","tip":"Challenger wins in complex deals with complacent buyers. Don't use it on a buyer already sold. you'll seem confrontational. Read the room.","color":"#e11d48"},{"id":"sandler","cat":"selling","name":"Sandler Selling System","full":"Bond & Rapport → Up-Front Contract → Pain → Budget → Decision → Fulfillment → Post-Sell","origin":"David Sandler, 1967. one of the most widely used frameworks globally","stage":"Full Sales Cycle","when":"Any deal where you want to stop chasing and start attracting. Kills the 'maybe' that drags on for months.","desc":"Sandler reverses the traditional sales dynamic: both buyer and seller qualify each other. The rep is the authority, not the supplicant. Goal: a clear YES or NO, not a maybe. No pressure tactics. Mutual respect.","letters":[{"l":"1","n":"Bond & Rapport","d":"Build genuine human trust before selling anything.","q":"Mirror their energy. Ask about their role, their plant, their biggest wins this year. Don't pitch in the first 3 minutes."},{"l":"2","n":"Up-Front Contract","d":"Set explicit expectations for the call. Both parties agree on what happens.","q":"'I want to make sure this is worth your time. Here's what I'm hoping to cover. does that work? And if it's not a fit, that's completely okay to say.'"},{"l":"3","n":"Pain (3 Levels)","d":"L1: surface pain. L2: business cost. L3: personal impact. Go all three levels.","q":"L1: 'What's the issue?' → L2: 'What does that cost you per month?' → L3: 'How does that affect you personally?'"},{"l":"4","n":"Budget","d":"Confirm they can fund it, and that they're willing to spend. Surface investment range early.","q":"'Typically a solution like this runs $X–Y annually. Is that the ballpark you've been thinking about, or would that be a challenge?'"},{"l":"5","n":"Decision","d":"Map the exact decision process and all stakeholders before you invest in a proposal.","q":"'Walk me through how a decision like this gets made at [Company]. who's involved, what are the steps, how long does it take?'"},{"l":"6","n":"Fulfillment","d":"Present the solution ONLY once Pain + Budget + Decision are confirmed. Premature demos kill deals.","q":"Hold the demo until the above is in place. 'Before I show you the platform, I want to make sure it actually maps to what you told me matters most..'"},{"l":"7","n":"Post-Sell","d":"Prevent buyer's remorse. Lock in next steps and surface late-breaking objections.","q":"'Is there anything that could get in the way of moving forward with what we agreed on today?' Ask this before you hang up."}],"apply":"Up-Front Contract on cold calls: 'I'll take two minutes. if it resonates, we go deeper. If not, I'll get out of your hair. Fair enough?'","tip":"Sandler's law: No mutual mystification. If you're confused about where a deal stands, ask directly. 'Where do you see this going?' Prospects respect directness.","color":"#059669"},{"id":"gap","cat":"selling","name":"Gap Selling","full":"Current State → Problem Identification → Future State → The Gap","origin":"Keenan (Jim Keenan), 2019","stage":"Discovery → Proposal","when":"When buyers need to see the full cost of their problem before they can value your solution.","desc":"People don't buy products. they buy movement from a painful present to a better future. The rep's job is to make the current state painful enough and the future state compelling enough that the gap demands to be closed.","letters":[{"l":"1","n":"Current State","d":"Deeply understand where they are now: tech stack, process, problems, human cost.","q":"Tulip current states: paper travelers, Excel QA, legacy MES, tribal knowledge, manual reporting, 40–60% OEE, compliance risk."},{"l":"2","n":"Problem Identification","d":"Go deeper than the surface. Root causes, downstream effects.","q":"'You mentioned paper travelers. what happens when a step gets skipped? How often? Before or after the product ships?'"},{"l":"3","n":"Future State","d":"Paint a vivid picture of life with the problem solved.","q":"Tulip future state: real-time traceability, 70% fewer defects, digital eBR, connected workers, 4-week NPI, always audit-ready."},{"l":"4","n":"The Gap","d":"The distance between current and future = the value of your solution. Quantify it.","q":"'Tulip customers average 448% ROI. For a plant your size, that gap is roughly $X.' Use the ROI Calculator in Tools."}],"apply":"Your gap pitch: 'Most floors run 40–60% OEE with manual reporting. Our customers average 15–25% productivity gains and 70% fewer defects in year one. That gap is real money.'","tip":"The wider the gap you can show, the less price matters. Make the current state painful, the future state vivid, and the gap undeniable.","color":"#0284c7"},{"id":"solution","cat":"selling","name":"Solution Selling","full":"Diagnose Pain → Create Vision → Map Capabilities","origin":"Mike Bosworth, 1983","stage":"Discovery → Proposal","when":"Complex deals where buyers need help defining what they actually need before choosing a vendor.","desc":"Positions the rep as a problem-solver, not a vendor. Diagnose the issue before prescribing the solution. When a buyer feels you understand their problem better than they do, price becomes secondary.","letters":[{"l":"1","n":"Diagnose Pain","d":"Uncover the real business problem before mentioning your product.","q":"'Before I show you anything about Tulip, walk me through what a typical shift looks like on your floor. Where does work pile up or break down?'"},{"l":"2","n":"Create Vision","d":"Help them envision the future state. without naming your product.","q":"'Imagine your operators had step-by-step guidance on any device and every action was automatically recorded. What would that change for QA and compliance?'"},{"l":"3","n":"Map Capabilities","d":"Once the vision is set, connect Tulip's capabilities to exactly what they described.","q":"'What you just described. digital work instructions, automatic audit trail, no paper. that's exactly what Tulip does. Let me show you a customer who was in your exact situation.'"}],"apply":"Rule: never lead with a demo. Diagnose first. Build the vision. Then show the product as the answer to their own words. They'll hear their description in your demo.","tip":"Solution Selling is the foundation under SPIN, Challenger, and Gap Selling. Master this and the others click into place.","color":"#7c3aed"},{"id":"conceptual","cat":"selling","name":"Conceptual Selling (Miller Heiman)","full":"Get Information · Give Information · Get Commitment","origin":"Robert Miller & Stephen Heiman, 1985","stage":"Discovery → Stakeholder Management → Close","when":"Large enterprise deals with buying committees. When you have 4+ stakeholders with different definitions of success.","desc":"You're not selling a product. you're selling a concept (each stakeholder's idea of their ideal solution). Align your solution to each person's concept. Famous for the Blue Sheet: deal management tool for mapping account power.","letters":[{"l":"1","n":"Get Information","d":"Understand what each stakeholder values and their personal definition of success.","q":"'What does a win look like for you personally on this project?' [Ask each stakeholder separately.]"},{"l":"2","n":"Give Information","d":"Share only what's relevant to this specific person's concept.","q":"EB → ROI/NPV. Champion → daily workflow wins. IT → integration/SOC 2. QA Director → compliance/audit trail. Tailor every conversation."},{"l":"3","n":"Get Commitment","d":"Lock in a concrete next step at every interaction. Not 'let's stay in touch.'","q":"'Based on today's conversation, the logical next step is [specific action]. Does [date] work?' Never leave a call without a committed next step."}],"apply":"Blue Sheet mental model: draw the account. Boxes = stakeholders. Arrows = influence. Circle the EB and your champion. Identify the gaps. Fill them before the final decision.","tip":"Four buyer types: Economic Buyer (approves budget), User Buyers (use it daily), Technical Buyer (IT/security veto), Coach (your guide to the org). Each needs a different message.","color":"#0891b2"},{"id":"blount","cat":"prospecting","name":"Blount / Fanatical Prospecting","full":"30-Day Rule · Law of Replacement · Multi-Channel · Power Hours","origin":"Jeb Blount, Fanatical Prospecting (2015)","stage":"Daily. Non-Negotiable","when":"Every day. Pipeline is a lagging indicator. What you do today shows up as meetings in 30–90 days.","desc":"Blount's core insight: most reps only prospect hard when pipeline is thin. by then it's too late. Fanatical Prospecting demands consistent daily activity regardless of current pipeline health.","letters":[{"l":"1","n":"30-Day Rule","d":"Prospecting you do today pays off in 30–90 days. Miss a day and a gap opens three months later.","q":"Daily non-negotiable: X cold calls + Y LinkedIn touches + Z emails. Even on demo days. Even on great days."},{"l":"2","n":"Law of Replacement","d":"When you close a deal (or book a meeting), replace it immediately.","q":"Just booked a meeting? Before you move on, add 2 new targets to your Hit List. Celebrate later."},{"l":"3","n":"Multi-Channel","d":"Phone + email + LinkedIn + video. Reps who rely on one channel leave 80% of opportunities untouched.","q":"Sequence: call → LinkedIn connect → email with value → call → personalized video → DM → call again."},{"l":"4","n":"Power Hours","d":"Protect 2–4 hours of uninterrupted prospecting daily. Block the calendar. No exceptions.","q":"Morning power hour: 8–10 AM. No meetings, no Slack, no admin. Dials only. Non-negotiable."}],"apply":"Your daily minimum: 60+ dials. Track it on your Hit List. The 30-Day Rule means today's calls become next quarter's quota. Don't borrow from your future self.","tip":"Blount's law: 'Amateurs wait for the perfect time to prospect. Professionals just prospect.' The best time to call was yesterday. Second best is now.","color":"#0284c7"},{"id":"sobczak","cat":"prospecting","name":"Sobczak / Smart Calling","full":"Research → Interest-Creating Statement → Engage or Qualify Out","origin":"Art Sobczak, Smart Calling (2010)","stage":"Before Every Cold Call","when":"Before you dial anyone. There are no cold calls if you've done the research. Replace cold with warm.","desc":"Sobczak's thesis: the only thing that makes a call cold is your lack of knowledge. The Interest-Creating Opening Statement (ICOS) is the antidote to pitch-slapping. it hooks the buyer by leading with their world, not your product.","letters":[{"l":"1","n":"Research","d":"Know their role, company, industry challenges, recent news, and likely pains before you dial.","q":"Pre-call research: LinkedIn (title, tenure, recent posts), company news, industry pain points, tech stack. The Research tab is your Sobczak engine."},{"l":"2","n":"Interest-Creating Statement","d":"Hook them in 15 seconds with something relevant to their world.","q":"Formula: 'I work with [role] who [their situation]. We help with [specific pain]. how you're [gap question] today.' Applied to all 40 personas in the Playbook tab."},{"l":"3","n":"Engage or Qualify Out","d":"If they engage, go deeper. If not, exit professionally and follow up systematically.","q":"'Sounds like the timing isn't right. is it okay if I reach back out in 60 days? And is there a better person on your team who handles this?'"}],"apply":"The Research tab in this app IS your Smart Calling system. Run it before every targeted account call. Don't dial without it.","tip":"Sobczak's rule: never open with 'How are you today?' It signals you're a rep. Use their name + your ICOS. Get to value in 10 seconds.","color":"#2563eb"},{"id":"voss","cat":"prospecting","name":"Voss / Tactical Empathy","full":"Mirroring · Labeling · Accusation Audit · Calibrated Questions · FM DJ Voice","origin":"Chris Voss, Never Split the Difference (2016). former FBI hostage negotiator","stage":"Prospecting + Objection Handling","when":"Objection handling. Difficult conversations. Keeping a prospect engaged when they're about to bail.","desc":"Voss's negotiation tactics translate directly to sales because buying is emotional. The goal isn't to overcome objections. it's to make the prospect feel heard so deeply that resistance dissolves on its own.","letters":[{"l":"1","n":"Mirroring","d":"Repeat the last 1–3 words the prospect said, slight upward inflection. Gets them to keep talking.","q":"Prospect: 'We're happy with what we have.' You: '..happy with what you have?' [silence] They'll explain the real objection."},{"l":"2","n":"Labeling","d":"Name the emotion you hear. 'It sounds like..' 'It seems like..' Then silence.","q":"'It sounds like this has been a frustrating process for your team.' [pause] They'll confirm and go deeper into the real pain."},{"l":"3","n":"Accusation Audit","d":"Pre-empt their objections by naming them first. Defenses drop when you say it before they can.","q":"'I know you probably get a ton of calls about MES software, and I know you probably don't need another vendor in your inbox, but I think this might be different.'"},{"l":"4","n":"Calibrated Questions","d":"How and What questions that make them think. not defend. Avoid Why (sounds accusatory).","q":"'What's your biggest challenge with your current process?' 'How does that affect your team day-to-day?' 'What would need to be true for you to want to explore this?'"},{"l":"5","n":"FM DJ Voice","d":"Slow, warm, calm tonality on objections. The voice of a problem-solver, not a pusher.","q":"When they say 'not interested': slow down, lower pitch slightly, 'I completely understand..' [2-second pause]. Never speed up under pressure."}],"apply":"On pushback: mirror + label before responding. 'It sounds like you've been burned by a bad implementation before..' They say yes, you've just unlocked the real objection.","tip":"Voss: 'No' isn't the end. 'No' means 'I'm not comfortable yet.' 'Not interested' means 'I haven't heard anything interesting yet.'","color":"#059669"},{"id":"weinberg","cat":"prospecting","name":"Weinberg / New Sales. Simplified.","full":"Hunting Mindset · ICP Discipline · 5-Touch Minimum · Sales Story","origin":"Mike Weinberg, New Sales. Simplified. (2012)","stage":"Account Selection + Pursuit Strategy","when":"Account planning and territory management. Not just activity. targeting strategy.","desc":"Weinberg's thesis: most salespeople are account managers who occasionally prospect. True hunters target the right accounts with a crisp story and relentless, systematic follow-through.","letters":[{"l":"1","n":"Hunting Mindset","d":"Treat prospecting as the job. not an interruption to the job.","q":"Your hunting block: mornings. No inbound processing, no admin, no Slack. Outbound only. This time is sacred."},{"l":"2","n":"ICP Discipline","d":"Know exactly who you're targeting. Every contact on your list should match the ICP.","q":"Tulip ICP: 50+ operators, discrete or regulated manufacturing, paper or legacy MES, growth-stage or digitally motivated leadership. Does this account match?"},{"l":"3","n":"5-Touch Minimum","d":"Most reps give up after 1–2 attempts. Most deals close after 5+ touches.","q":"Sequence: Call 1 → VM + Email → LinkedIn → Call 2 → Value-add email → Call 3 → Video → Call 4. Never stop at 2."},{"l":"4","n":"Sales Story","d":"Have a crisp, compelling narrative about why your company, why now, why you.","q":"Tulip's story: 'We're the composable operations platform that puts a digital layer on top of your floor. custom apps in days, not months, and the ROI to back it up.'"}],"apply":"Weekly review: Am I hunting the right accounts? Have I put in 5+ touches before moving on? Hit List discipline is Weinberg in action.","tip":"Weinberg: 'The pipeline is the most important asset you own in sales. Guard it, feed it, and review it relentlessly.' Build the pipeline you wish you had 90 days from now.","color":"#e11d48"},{"id":"farrokh","cat":"prospecting","name":"30MPC / Farrokh + Cegelski","full":"Win First 60 Seconds · Mr. Miyagi Objection · 1-in-3 Benchmark","origin":"Armand Farrokh & Nick Cegelski, 30 Minutes to President's Club","stage":"Cold Call Execution","when":"Every cold call. The actual mechanics of what to say in the first 60 seconds, and when they push back.","desc":"Farrokh and Cegelski cut through theory with battle-tested call mechanics. Benchmark: 1 in 3 cold call connects should book a meeting if your opener and objection handling are dialed in. Most SDRs run 1 in 10.","letters":[{"l":"1","n":"Win the First 60 Seconds","d":"Your opener determines everything. Lead with a relevant insight.","q":"Chris's formula: 'Hey [Name], Chris from Tulip. I work with [role] using [their situation]. We're that layer on top for [value]. how you're [gap question] today?'"},{"l":"2","n":"Mr. Miyagi Method","d":"On 'not interested': agree with them, then redirect. Don't fight the objection. use its momentum.","q":"'Not interested.' → 'Fair enough. most people I talk to aren't until they hear one thing: [sharp insight]. Does that change anything for you?'"},{"l":"3","n":"1-in-3 Benchmark","d":"Audit your opener and objection handling. not your call volume. if you're under 1 meeting per 3 connects.","q":"Track your funnel: connects → openers delivered → objections handled → meetings booked. Where does it break? Fix that link."}],"apply":"Your opener is already Farrokh-formatted (see Playbook tab per persona). Practice it 10x before dialing. The first 15 words either open the conversation or end it.","tip":"30MPC rule: if your opener doesn't get a response in 15 seconds, you've lost them. Tight. Relevant. Ends in a question. Every time.","color":"#ea580c"},{"id":"obj-nointeres","cat":"objections","type":"objection","name":"Not Interested","tag":"REFLEXIVE","what":"They don't actually know enough to be uninterested yet. This is a knee-jerk defensive reflex, not a real objection.","color":"#e11d48","t1":"'Totally get it. I wouldn't expect you to be interested in something you haven't heard about yet. All I'm asking for is 27 seconds. If it's not relevant, I'll disappear. Fair enough?'","t2":"[Voss/Miyagi] 'Not interested.' → '..not interested?' [silence, let them fill it] OR 'Fair enough. most [role] I talk to aren't until they hear one thing: we help plants like yours cut defects 70% without ripping out existing equipment. Does that change anything?'"},{"id":"obj-email","cat":"objections","type":"objection","name":"Send Me an Email","tag":"STALL","what":"They're trying to end the call politely. An email will get deleted. This is a brush-off, not genuine interest.","color":"#e11d48","t1":"'Happy to, but I'd hate to send something generic. Let me ask you one thing first so I can make it worth reading: what's the biggest challenge on your floor right now. paper, quality, compliance? [Listen] Perfect. I'll make it specific to that.'","t2":"'I'll send something over right now. But I want to make sure it's not another email you delete. Can I ask. is the timing genuinely bad, or is there something about this that didn't land for you?' [Voss label. uncover the real objection]"},{"id":"obj-system","cat":"objections","type":"objection","name":"We Have a System","tag":"COMPETITIVE","what":"They already use something. could be paper, Excel, a legacy MES, ERP add-on, or a point solution. This is your best opportunity to differentiate.","color":"#e11d48","t1":"'What are you using today? [Listen] Got it. we work alongside [system] all the time, actually. The gap we typically fill is the real-time layer between your ERP and what's actually happening on the floor. What does your current system do when an operator skips a step or a quality issue surfaces mid-process?'","t2":"'Sounds like you're covered. Can I ask. when's the last time you had an audit, and how did documentation hold up? [Listen] That's exactly the gap we fill for most of our customers. Not replacing [system]. just making what happens on the floor traceable in real time.'"},{"id":"obj-renewed","cat":"objections","type":"objection","name":"Just Renewed / Just Signed","tag":"TIMING","what":"They recently committed to another vendor. This is a timing objection, not a permanent no. Your goal is to stay in their orbit for the renewal.","color":"#e11d48","t1":"'Totally makes sense. I actually respect that, bad timing on my part. Can I ask. what were the deciding factors when you went with [vendor]? [Listen] Good to know. We hear that a lot actually. The reason I'd stay in touch is that a lot of teams outgrow [vendor] in year two once they try to scale. Would it be okay to reconnect closer to your renewal?'","t2":"'When does your contract come up? [Get the date] Perfect. I'll put a reminder and reach back out then. not to sell anything, just to see how it's going. Fair enough?'"},{"id":"obj-timing","cat":"objections","type":"objection","name":"Not a Good Time","tag":"TIMING","what":"Could be real (genuine chaos) or reflexive. Distinguish between 'bad week' and 'bad year'. one is a reschedule, the other is a disqualifier.","color":"#e11d48","t1":"'No worries at all. what would be a better time? [Get a specific date] I'll follow up then. And just so I make it worth it when we connect. is timing the issue, or is there something about what I said that didn't resonate?'","t2":"[Voss label] 'It sounds like things are pretty full right now.' [Let them respond. they'll either confirm it's a reschedule or reveal the real objection]"},{"id":"obj-budget","cat":"objections","type":"objection","name":"No Budget","tag":"RESOURCE","what":"Budget either doesn't exist yet, was cut, or you haven't built a compelling enough business case to create it. Rarely a permanent blocker.","color":"#e11d48","t1":"'Totally understand. most of the best projects we've run started that way. Can I ask: is there no budget because this hasn't been prioritized, or because no one's built the business case yet? [Listen] If it's the latter, that's something I can help with. our customers typically see $10 back for every $1 in. Would it be worth 20 minutes to see what that math looks like for your plant?'","t2":"'Makes sense. When does your budget cycle reset? [Listen] And hypothetically. if the ROI was undeniable, is there a path to find budget this year, or would this be a next-fiscal conversation?'"},{"id":"obj-notlooking","cat":"objections","type":"objection","name":"Not Looking at Vendors","tag":"TIMING","what":"They're not in active buying mode. This doesn't mean the pain doesn't exist. it means the urgency hasn't surfaced yet.","color":"#e11d48","t1":"'That's fine. we're not asking you to buy anything. The reason I reached out is that most plants we work with weren't looking either until something forced the issue. I'm curious: what's the one thing on your floor that if you fixed it, would change your results the most?'","t2":"[Challenger] 'Honestly, the best conversations we have are with people who aren't looking yet. because we can talk about the problem without a sales agenda. What's the thing keeping you up at night operationally?'"},{"id":"obj-statusquo","cat":"objections","type":"objection","name":"Happy With Status Quo","tag":"COMPLACENCY","what":"The most dangerous objection. They're not feeling enough pain to move. Your job is to surface pain they haven't named yet, or quantify the cost of staying put.","color":"#e11d48","t1":"[Challenger] 'That's actually where most of our best customers were 12 months before we talked to them. Then an audit, a product recall, or a quality escape made the cost of staying put undeniable. What would an event like that mean for your business?'","t2":"'Great. what's working? [Listen] And where do you still feel friction? [Listen for: paper, manual reporting, rework, inspection bottlenecks] Those are usually the gaps. We're not here to replace what's working. just to close what isn't.'"},{"id":"obj-sap","cat":"objections","type":"objection","name":"We Use SAP / Siemens / Incumbent","tag":"COMPETITIVE","what":"They're loyal to or locked into a major vendor. They may not realize their incumbent doesn't cover the shop floor the way Tulip does.","color":"#e11d48","t1":"'Great. we actually integrate with [SAP/Siemens] and work alongside them constantly. The question is: does your [ERP/incumbent] give your operators real-time step-by-step guidance on the floor and auto-capture every action for audit? [Pause] That's the gap most teams tell us they have, and that's exactly where Tulip lives.'","t2":"'Totally get it. Out of curiosity, when you think about where [SAP/Siemens] falls short on the floor. paper workarounds, manual data entry, operators going off-script. is any of that a real frustration? That's the specific gap we fill.'"},{"id":"obj-whoisthis","cat":"objections","type":"objection","name":"Who Is This / How Did You Get My Number","tag":"TRUST","what":"They're caught off guard or mildly annoyed. This is a tone objection, not a rejection. Stay calm, be direct, and show credibility fast.","color":"#e11d48","t1":"'This is Chris from Tulip. I reached out because I work with [role] in [industry] and figured it was worth a quick call. If the timing's bad I can call back. what's a better time?'","t2":"'Fair question. I found your name because you're [End User / VP Ops] at [Company] and we work with a lot of teams in [industry] on digitizing operations. I'll be quick: [ICOS]. If it's not relevant, just say so and I'll be out of your hair.'"},{"id":"obj-procurement","cat":"objections","type":"objection","name":"Talk to Procurement / Go Through the Portal","tag":"PROCESS","what":"They're deflecting to process rather than engaging on value. Usually means they're not the decision-maker, or they're not sold enough to be your champion yet.","color":"#e11d48","t1":"'Happy to do that. I just want to make sure it's worth everyone's time before we spin up a formal process. Can I ask you two quick questions first: [1] Is there a real problem you're trying to solve, and [2] are you the right person to evaluate a solution like this?'","t2":"'Totally respect that. just want to make sure we're solving the right problem before going formal. Would it make sense to have a 20-minute conversation with you and your team first to see if there's even a fit?'"},{"id":"obj-failedimp","cat":"objections","type":"objection","name":"We Tried Something Like This Before / It Failed","tag":"TRUST","what":"They got burned. This is the highest-trust objection. acknowledge it, dig into why it failed, and show specifically how Tulip is different.","color":"#e11d48","t1":"[Voss label] 'It sounds like that was a really frustrating experience.' [Let them vent] 'What went wrong. was it the technology, the implementation, the adoption, or something else? [Listen] That's actually really useful context, because that's specifically what we've built differently..'","t2":"'That's a fair concern and honestly something I hear often. The reason most MES implementations fail isn't the technology. it's rigid systems that IT has to build and the floor won't use. Tulip is no-code, so operators build and own it. Can I show you one customer example where they came from a failed implementation?'"},{"id":"seq-tier1","cat":"sequences","type":"sequence","name":"Tier 1. Economic Buyers","full":"VP Ops · COO · CEO · Director of Manufacturing","color":"#2563eb","desc":"Economic buyers are results-driven and time-poor. Every touch must lead with business impact, not product features. Use Tulip's ROI data aggressively. Reference peer companies.","touches":[{"n":1,"ch":"📞 Cold Call","when":"Day 1","subject":"","body":"ICOS opener: 'I work with VP Ops teams running paper-heavy or legacy MES floors. We help them get a digital layer on top in weeks, not a 12-month IT project. how you're thinking about closing that gap today.' → If VM: leave voicemail, follow immediately with email."},{"n":2,"ch":"📧 Email (post-VM)","when":"Day 1 (same day)","subject":"Re: [Company] ops floor digitization","body":"[Name], tried you just now. Quick context: I work with [role peers] at companies like [relevant customer]. They were managing [specific pain] with [paper/legacy system] before switching to Tulip. Forrester: 448% ROI and <6-month payback. Worth 20 minutes?. Chris"},{"n":3,"ch":"💼 LinkedIn Connect","when":"Day 3","subject":"","body":"Connection note: 'Hi [Name]. I work with VP Ops teams in [industry] on closing the gap between their ERP and what's actually happening on the floor. Would love to connect and share a relevant case study.'"},{"n":4,"ch":"📞 Call + 📧 Email","when":"Day 7","subject":"One stat from [similar company]","body":"Call attempt first. Email: 'Wanted to share one number: [Customer in their industry] reduced defects 70% and recovered $1M+ in year one with Tulip. Similar floor to yours by the look of it. Worth a quick conversation? Still happy to show you exactly how they did it. Chris'"},{"n":5,"ch":"📞 Break-Up Call","when":"Day 14","subject":"Should I stop reaching out?","body":"'[Name], I've reached out a few times without hearing back. I'll take the hint if it's not relevant, but I didn't want to disappear without asking one question: is the floor digitization challenge not a priority right now, or did my messaging just not land? Either answer is genuinely helpful.' [If VM. same message, then withdraw]"}],"tip":"For Tier 1, always lead with Metrics (MEDDPICC M). CEO/COO speak in dollars and percentages. $16.23M NPV, 448% ROI, 70% fewer defects. Specific beats vague every time."},{"id":"seq-tier2","cat":"sequences","type":"sequence","name":"Tier 2. Champions","full":"End User · Ops Manager · IE · Mfg Engineer · Production Supervisor","color":"#059669","desc":"Champions feel the pain daily. They're closer to the problem but may need to build the business case upward. Lead with their operational reality, not corporate ROI. Make them look like heroes.","touches":[{"n":1,"ch":"📞 Cold Call","when":"Day 1","subject":"","body":"ICOS opener: 'I work with [End Users / IEs] running floors where paper travelers and manual reporting are still the norm. We help digitize that. no IT project required. how you're where [specific pain for role] today.' → Listen for the pain."},{"n":2,"ch":"📧 Email (post-VM)","when":"Day 1","subject":"Paper on the floor → what we hear from [role peers]","body":"[Name], couldn't reach you but wanted to leave a note. Most [End Users] I talk to are where [rework, compliance docs, operator skill gaps]. We close that gap with no-code apps that operators actually use. Companies like [customer] cut scrap 53% in 6 months. Worth 20 minutes?. Chris"},{"n":3,"ch":"💼 LinkedIn + value","when":"Day 4","subject":"","body":"Connect + message: 'Hi [Name]. saw you're running ops at [Company]. I work with [End Users / IEs] on digitizing floor processes without big IT projects. Sharing a quick case study from a team in [their industry] that might be relevant. Would love your take.'"},{"n":4,"ch":"📞 Call + 📧 Email","when":"Day 9","subject":"Quick Q about your floor","body":"Email: '[Name]. quick question: how are your operators currently capturing quality data at the point of production? Most floors I visit still rely on paper or manual entry after the fact. That gap is where we typically find the biggest wins. Worth a conversation?. Chris'"},{"n":5,"ch":"📞 Break-Up","when":"Day 16","subject":"Last note from me","body":"'[Name]. last reach-out, I promise. I didn't want to disappear without sharing one thing: a [End User / IE] at [similar company] was skeptical too. said they'd tried systems before that never stuck. [Result they got.] If that ever becomes relevant, you know where to find me. Chris'"}],"tip":"For Tier 2, make them the hero. 'Imagine walking into your next review with a 70% defect reduction and a fully compliant audit trail.' Champions need to picture their win before they'll champion you."},{"id":"seq-tier3","cat":"sequences","type":"sequence","name":"Tier 3. Technical Influencers","full":"IT Director · Technical Buyer · Validation Engineer · Systems Engineer","color":"#7c3aed","desc":"Technical buyers are gatekeepers and validators. not economic buyers. They care about integration risk, security, compliance, and implementation complexity. Lead with de-risking, not ROI.","touches":[{"n":1,"ch":"📞 Cold Call","when":"Day 1","subject":"","body":"ICOS for IT Dir: 'I work with IT Directors who are getting pressure to digitize shop floor ops without taking on a massive integration project. We're a no-code platform with OPC-UA, REST APIs, and pre-built ERP connectors. SOC 2 certified, AWS-hosted. how you're thinking about that layer today.'"},{"n":2,"ch":"📧 Email","when":"Day 1","subject":"Tulip + [ERP they use]: integration overview","body":"[Name], tried you today. Quick context: Tulip integrates with [SAP/Oracle/Epicor/Plex] via REST API, OPC-UA for machine data, and has SOC 2 Type II + AWS hosting. No custom code required on your end. IT teams at [reference customer] went live in 8 weeks. Worth a technical call?. Chris"},{"n":3,"ch":"💼 LinkedIn","when":"Day 5","subject":"","body":"'Hi [Name]. I work with IT/OT teams navigating the gap between ERP and the shop floor. We're a no-code MES that connects to your stack without custom dev. Happy to share our integration architecture doc. Would love to connect.'"},{"n":4,"ch":"📧 Email. Security/Compliance","when":"Day 10","subject":"Security, FedRAMP, SOC 2. quick overview","body":"[Name], following up with a quick security snapshot: Tulip is SOC 2 Type II certified, ISO 9001:2015, 21 CFR Part 11 compliant, and pursuing FedRAMP moderate. AWS GovCloud available for defense/government customers. Happy to share the security overview doc. Chris"},{"n":5,"ch":"📞 Break-Up","when":"Day 18","subject":"One last thing","body":"'[Name]. last note from me. I know technical evaluations require real cycles and I don't want to be noise. If the platform-to-platform integration question or compliance burden ever becomes your problem to solve, I'd love to be the first call. In the meantime. here's our integration architecture overview: [doc]. Chris'"}],"tip":"For Tier 3, de-risk everything. SOC 2, FedRAMP, 21 CFR 11, OPC-UA, REST API, 8-week go-live. They need to know it won't become their problem. Make the no-code angle feel like less IT work, not more."},{"id":"triggers-all","cat":"triggers","type":"triggers","name":"Compelling Events Library","full":"Compliance · Operational · Growth · Leadership · Technology","color":"#ea580c","desc":"Compelling events create the urgency that moves deals from 'interesting' to 'we need to act now.' Monitor these signals and reference them in your opener. They're your forcing functions.","sections":[{"label":"🔴 Compliance & Regulatory","color":"#e11d48","events":[{"e":"FDA Warning Letter / 483 Observations","hook":"'We're working with several med device teams right now coming off 483s. digital traceability and electronic DHR are the fastest path to a corrective action plan.'"},{"e":"Upcoming External Audit (ISO, AS9100, DCMA, FDA)","hook":"'Most QA directors I talk to pre-audit are running around pulling paper records. What does your audit prep look like right now?'"},{"e":"New Regulation Requirement (21 CFR 11, Annex 11, CMMC)","hook":"'Are you starting to feel the pressure around [21 CFR 11 / CMMC] compliance? That's the exact trigger that gets most teams to finally replace paper.'"},{"e":"Failed Audit / Corrective Action Mandate","hook":"'If you're under a corrective action mandate right now, the fastest way to close it is a digital work instruction + auto-audit trail. That's a 6-8 week Tulip deployment.'"},{"e":"AS9100 / NADCAP Renewal Coming Up","hook":"'How are you currently managing your AS9100 evidence? Most A&D teams I talk to are spending 2–3 days pulling docs for every audit. we get that to hours.'"}]},{"label":"🟠 Operational Crisis","color":"#0284c7","events":[{"e":"Quality Escape / Product Recall","hook":"'Did you see the [industry] recall last month? Most of the teams we work with after a quality escape say the same thing: we couldn't trace it fast enough. What's your traceability like right now?'"},{"e":"High Scrap Rate / Rework Spike","hook":"'When you see a scrap spike, how long does it take to identify the root cause? Most floors I visit take days. We get that to minutes.'"},{"e":"Production Line Shutdown / Unplanned Downtime","hook":"'Downtime is the most expensive 4-letter word in manufacturing. What does an hour of downtime cost your plant? [Listen] That's usually where Tulip pays for itself fastest.'"},{"e":"Missed Customer Delivery / OTD Miss","hook":"'Are you feeling pressure from customers on delivery right now? OTD misses usually trace back to a visibility gap between what's scheduled and what's actually happening on the floor.'"},{"e":"New Customer Quality Requirement (Tier 1 customer mandate)","hook":"'Did a customer just add a new quality or traceability requirement? That's usually the forcing function that gets teams to move.'"}]},{"label":"🟢 Strategic Growth","color":"#059669","events":[{"e":"New Plant Opening / Facility Expansion","hook":"'If you're opening a new line or plant, that's the perfect time to get the digital infrastructure right from day one instead of inheriting paper processes.'"},{"e":"New Product Introduction (NPI) / Product Launch","hook":"'How long does your NPI cycle take right now? Most teams we work with cut it from 8 weeks to 3–4 with digital work instructions. Is there a launch in the pipeline?'"},{"e":"ERP Go-Live / ERP Upgrade (SAP S/4, Oracle, etc.)","hook":"'Are you going through an ERP migration right now? That's when most teams realize the ERP doesn't handle what happens on the floor. that's the gap Tulip fills.'"},{"e":"M&A Activity / New Ownership","hook":"'With new ownership usually comes a push for operational visibility and standardization across sites. Is there a new mandate from the top?'"},{"e":"Government Contract Win (DoD, defense)","hook":"'Congrats on the [DoD / defense contract]. New DoD contracts typically trigger AS9100, ITAR, and DCMA audit requirements. Are you set up for that digitally?'"}]},{"label":"🔵 Leadership Change","color":"#2563eb","events":[{"e":"New COO / VP Operations Hired","hook":"'New ops leadership usually means the first 90 days are all about identifying quick wins on the floor. Is that the environment you're in right now?'"},{"e":"Digital Transformation Initiative Announced","hook":"'I saw [Company] announced a digital transformation initiative. congrats. The teams we work with usually find the shop floor is the last place to get the digital investment. Is that true for you?'"},{"e":"Operations Reorg / New End User","hook":"'Change in leadership is usually when there's an appetite to try things that were stuck before. What's the one thing you'd fix first with some breathing room?'"},{"e":"CEO Mandate for Operational Excellence","hook":"'Is there a top-down push around OEE, quality, or operational efficiency right now? That's usually what breaks the 'we've always done it this way' log jam.'"}]},{"label":"⚙️ Technology Signals","color":"#7c3aed","events":[{"e":"Job Posting: Manufacturing Engineer / IE / Digital Ops","hook":"'I noticed you're hiring for [role]. that usually means the ops team is scaling and there's work that needs to get done. Is digitizing floor processes part of that agenda?'"},{"e":"Job Posting: IT/OT Convergence / Digital Manufacturing","hook":"'Posting for an IT/OT role usually means you're starting to connect machines to data. Tulip sits right at that intersection. are you building a unified namespace or starting with specific use cases?'"},{"e":"ERP Implementation Underway","hook":"'ERP implementations almost always expose the shop floor visibility gap. What are you doing on the MES side to complement that investment?'"},{"e":"Legacy MES / SCADA End-of-Life","hook":"'Is your current [system] coming up on end-of-life or becoming a maintenance burden? Most teams in that position are looking for something that doesn't require a 3-year IT project to replace it.'"},{"e":"LinkedIn Post About Operational Pain / Digital Manufacturing","hook":"They're signaling publicly. reference it directly: 'Saw your post about [topic]. that's exactly the problem Tulip was built to solve. Happy to show you a quick example?'"}]}],"tip":"Monitor: company LinkedIn pages, job postings on LinkedIn/Indeed, press releases, earnings calls, industry news. Set Google Alerts for your top accounts. Use the Research tab to scan before calling."},{"id":"tool-roi","cat":"tools","type":"tool-roi","name":"ROI Calculator","full":"Project ROI for a prospect in real time","color":"#7c3aed"},{"id":"tool-icp","cat":"tools","type":"tool-icp","name":"ICP Fit Scorer","full":"6-question account qualification check","color":"#059669"},{"id":"tool-scorecard","cat":"tools","type":"tool-scorecard","name":"MEDDPICC Scorecard","full":"Score a live deal 0–8 before AE handoff","color":"#2563eb"}],"PERSONA_OVERRIDES":{"pharma_0":{"openers":["Hey [Name], this is Chris from Tulip Interfaces. I know I'm catching you out of the blue. Tulip helps manufacturers modernize their operations. think live production visibility across every site, digital work instructions, and AI that actually runs on the floor. how are you getting a real-time picture of throughput across your plants right now?","Hey [Name], Chris from Tulip. I work with VP Ops and COOs at pharma and biotech companies running paper batch records and manual eBR on their production floors. We're the composable MES with GxP compliance built in. 21 CFR Part 11, Annex 11, deployed in months not years. How are you handling batch documentation and audit readiness?"],"cares":["FDA audit readiness and zero 483 findings","eBR deployment without 18-month IT cycles","Batch cycle time and changeover efficiency","CAPA closure rates and regulatory standing","GxP validation burden on the IT/quality team"],"pains":["Paper batch records creating FDA audit liability","CSV validation taking 12–18 months per system","Changeover time 10–14+ days between products","Operators transcribing data. transcription error risk","Traceability gaps slowing batch release"],"pitch":"We're the composable MES that pharma and biotech operations teams use to replace paper eBR with GxP-compliant digital batch records in 6 months. not 18. Sharp runs GxP clinical packaging on Tulip 30% faster. 21 CFR Part 11, Annex 11, GAMP5. built in, not bolted on. Forrester: 448% ROI. Most teams are audit-ready on day one.","qs":["How are your batch records currently managed. paper, hybrid, or electronic?","When FDA walks in, how fast can you pull a complete batch record for a specific lot?","What's your current CSV validation cycle for new systems?","What does product changeover look like. how long and where does the time go?","Are you under any current 483 observations or have you had a Warning Letter recently?"],"vm":"Hey [Name], this is Chris from Tulip. I left a message earlier about replacing paper batch records with GxP-compliant digital eBR. Pharma teams run GxP production on us — Tulip spans 1,000 customer sites worldwide. 21 CFR Part 11, Annex 11 compliant, deployed in months. If FDA audit readiness or changeover time is a priority right now, worth 20 /* ---- tiny CSV parser (quotes, CRLF, auto delimiter) ---- */
function csvParse(text){
  const firstLine=(text.split(/\r?\n/)[0]||"");
  const delim=[["\t"],[";"],[","]].map(([d])=>[d,firstLine.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else inQ=false}
      else cell+=c;
    }else if(c==='"')inQ=true;
    else if(c===delim){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(cell);cell="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    }else cell+=c;
  }
  row.push(cell);
  if(row.some(x=>x.trim()!==""))rows.push(row);
  return rows;
}
function mapCsvTargets(text){
  const rows=csvParse(text.replace(/^\uFEFF/,""));
  if(!rows.length)return{fields:null,items:[]};
  const heads=rows[0].map(h=>String(h).trim().toLowerCase());
  /* exact match first, substring only as fallback — otherwise a data row like
     "…,Intel,…" reads as a header ("tel") and silently swallows row 1 */
  const find=(...names)=>{
    for(const n of names){const i=heads.findIndex(h=>h===n);if(i>=0)return i}
    for(const n of names){const i=heads.findIndex(h=>h.includes(n));if(i>=0)return i}
    return -1;
  };
  const HEADER_WORDS=["name","full name","contact name","contact","first name","firstname","first","last name","lastname","last","company","account","organization","organisation","employer","job title","title","role","position","phone","phone number","mobile","direct","number","tel","notes","comments","description","trigger"];
  const hasHeader=heads.some(h=>HEADER_WORDS.includes(h));
  const col={
    first:find("first name","firstname","first"),
    last:find("last name","lastname","last"),
    name:find("full name","contact name","name","contact"),
    company:find("company","account","organization","organisation","employer"),
    title:find("job title","title","role","position"),
    phone:find("phone number","phone","mobile","direct","tel","number"),
    notes:find("notes","comments","description","trigger"),
  };
  const body=hasHeader?rows.slice(1):rows;
  const items=body.map(r=>{
    const get=i=>i>=0&&r[i]!=null?String(r[i]).trim():"";
    let name;
    if(hasHeader){
      name=get(col.name)||[get(col.first),get(col.last)].filter(Boolean).join(" ");
      return{name,company:get(col.company),title:get(col.title),phone:get(col.phone),notes:get(col.notes)};
    }
    return{name:(r[0]||"").trim(),company:(r[1]||"").trim(),title:(r[2]||"").trim(),phone:(r[3]||"").trim(),notes:(r[4]||"").trim()};
  }).filter(x=>x.name||x.company);
  return{hasHeader,items};
}

function callWindow(){
  const d=new Date(),hr=d.getHours()+d.getMinutes()/60,day=d.getDay();
  const prime=(hr>=10&&hr<11.5)||(hr>=16&&hr<17);
  const good=(hr>=9&&hr<12)||(hr>=14&&hr<17.5);

/* ================= HOTKEYS — scope stack ================= */
/* Components push a handler scope on mount (later mounts = higher priority:
   modal > page > app). A handler returns true to consume the key. Keys are
   ignored while typing in any field; Escape blurs the field instead. */
const HK={stack:[]};
function hkPush(handler){
  const entry={handler};HK.stack.push(entry);
  return()=>{const i=HK.stack.indexOf(entry);if(i>=0)HK.stack.splice(i,1)};
}
function useHotkeys(handler){
  const ref=useRef(handler);ref.current=handler;
  useEffect(()=>hkPush(e=>ref.current(e)),[]);
}
function hkTyping(e){
  const t=e.target;
  if(!t)return false;
  if(t.isContentEditable)return true;
  const tag=(t.tagName||"").toLowerCase();
  if(tag==="textarea"||tag==="select")return true;
  if(tag==="input"){
    const ty=(t.type||"text").toLowerCase();
    return !["checkbox","radio","button","submit","range","file","color"].includes(ty);
  }
  return false;
}
function hkDispatch(e){
  for(let i=HK.stack.length-1;i>=0;i--){
    let handled=false;
    try{handled=HK.stack[i].handler(e)===true}catch(err){console.warn("hotkey handler:",err)}
    if(handled){e.preventDefault();return true}
  }
  return false;
}
window.addEventListener("keydown",e=>{
  if(e.repeat)return;   /* held keys must not machine-gun dispositions/nav */
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==="k"){
    e.preventDefault();window.dispatchEvent(new Event("v5palette"));return;
  }
  if(hkTyping(e)){
    /* Escape leaves the field — and still closes an open overlay in one press */
    if(e.key==="Escape"){e.target.blur();hkDispatch(e)}
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  hkDispatch(e);
});
</script>

function fuzzyScore(q,s){
  s=s.toLowerCase();q=q.toLowerCase().trim();
  if(!q)return 0;
  const idx=s.indexOf(q);
  if(idx>=0)return 1000-idx;
  let si=0,score=0;
  for(const ch of q){
    if(ch===" ")continue;
    si=s.indexOf(ch,si);
    if(si<0)return -1;
    score+=1;si++;
  }
  return score;
}
function Palette({onClose,go}){
  const [q,setQ]=useState("");
  const [sel,setSel]=useState(0);
  const items=useMemo(()=>paletteItems(go),[]);
  const hits=useMemo(()=>{
    if(!q.trim())return items.slice(0,12);
    const scored=[];
    items.forEach(it=>{const s=fuzzyScore(q,it.t+" "+it.label+" "+(it.sub||""));if(s>=0)scored.push({it,s})});
    scored.sort((a,b)=>b.s-a.s);
    return scored.slice(0,12).map(x=>x.it);
  },[q,items]);
  const si=Math.max(0,Math.min(sel,hits.length-1));
  const pick=it=>{onClose();it.run()};
  const listRef=useRef(null);
  useEffect(()=>{const el=listRef.current&&listRef.current.querySelector(".pal-sel");if(el)el.scrollIntoView({block:"nearest"})},[si,q]);
  /* modal scope: nothing leaks to the page below while the palette is open */
  useHotkeys(e=>{
    if(e.key==="Escape")onClose();
    return true;
  });
  return h("div",{className:"modal-veil",style:{alignItems:"flex-start",paddingTop:"12vh"},onClick:onClose},
    h("div",{className:"modal anim-pop",style:{maxWidth:560,padding:0},onClick:e=>e.stopPropagation()},
      h("div",{style:{padding:"14px 16px",borderBottom:"2px solid var(--line)"}},
        h("div",{className:"row",style:{marginBottom:8}},
          h("span",{className:"eyebrow",style:{color:"var(--sig)"}},"COMMAND PALETTE"),
          h("div",{className:"grow"}),
          h("span",{className:"kbd"},"↑↓"),h("span",{className:"kbd"},"ENTER"),h("span",{className:"kbd"},"ESC")),
        h("input",{autoFocus:true,value:q,placeholder:"Module, action, persona, objection, template, target…",style:{width:"100%"},
          onChange:e=>{setQ(e.target.value);setSel(0)},
          onKeyDown:e=>{
            if(e.key==="ArrowDown"){e.preventDefault();setSel(Math.min(hits.length-1,si+1))}
            else if(e.key==="ArrowUp"){e.preventDefault();setSel(Math.max(0,si-1))}
            else if(e.key==="Enter"){e.preventDefault();if(hits[si])pick(hits[si])}
            else if(e.key==="Escape"){onClose()}
          }})),
      h("div",{ref:listRef,style:{maxHeight:"46vh",overflowY:"auto"}},
        hits.map((it,i)=>h("div",{key:it.t+it.label+i,className:"list-item"+(i===si?" on pal-sel":""),
            onMouseMove:()=>setSel(i),onClick:()=>pick(it)},
          h("div",{className:"row",style:{gap:8}},
            h("span",{className:"stamp",style:{fontSize:7.5,color:it.c,flexShrink:0}},it.t),
            h("b",{style:{fontSize:12.5}},it.label)),
          it.sub&&h("div",{className:"mono dim",style:{fontSize:9,marginTop:1}},it.sub))),
        !hits.length&&h("div",{className:"mono dim",style:{padding:16,fontSize:11}},"No matches"))));
}

    h(Blk,{title:"POWER HOUR — TIMED SPRINT",tag:sprintOn?"ON":"OFF",color:sprintOn?"var(--sig)":"var(--dim)",style:{marginBottom:16}},
      h("div",{className:"row",style:{flexWrap:"wrap",gap:12}},

function LiveCall({queueIds,sprint,onEnd}){

            h("span",{className:"mono dim",style:{fontSize:10}},(idx+1)+" / "+queueIds.length)),

<script>
"use strict";
/* ================= OBJECTIONS ================= */
function ObjForm({initial,onSave,onCancel}){
  const [f,setF]=useState(initial||{name:"",tag:"CUSTOM",what:"",t1:"",t2:""});
  return h(Modal,{onClose:onCancel},
    h("div",{className:"disp",style:{fontSize:20,marginBottom:14}},initial?"EDIT OBJECTION":"BUILD AN OBJECTION"),
    h(Field,{label:"WHAT THEY SAY"},h("input",{style:{width:"100%"},value:f.name,onChange:e=>setF({...f,name:e.target.value}),placeholder:'"We build everything in-house"'})),
    h(Field,{label:"TAG"},h("input",{style:{width:"100%"},value:f.tag,onChange:e=>setF({...f,tag:e.target.value.toUpperCase()}),placeholder:"COMPETITIVE / TIMING / TRUST…"})),
    h(Field,{label:"WHAT'S REALLY HAPPENING"},h("textarea",{rows:2,style:{width:"100%"},value:f.what,onChange:e=>setF({...f,what:e.target.value})})),
    h(Field,{label:"TRACK 1 (your go-to response)"},h("textarea",{rows:3,style:{width:"100%"},value:f.t1,onChange:e=>setF({...f,t1:e.target.value})})),
    h(Field,{label:"TRACK 2 (alternate angle)"},h("textarea",{rows:3,style:{width:"100%"},value:f.t2,onChange:e=>setF({...f,t2:e.target.value})})),
    h("div",{className:"row",style:{justifyContent:"flex-end"}},
      h("button",{className:"btn ghost",onClick:onCancel},"CANCEL"),
      h("button",{className:"btn primary",onClick:()=>{if(!f.name||!f.t1)return toast("NAME + TRACK 1 REQUIRED");onSave(f)}},"SAVE")));
}
function DrillMode({onExit}){
  /* spaced repetition: weak spots first, then never-drilled, then solid — shuffled within groups */
  const objs=useMemo(()=>{
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const weak=[],unseen=[],solid=[];
    allObjections().forEach(o=>{
      const s=AppState.drillStats[o.id];
      if(!s||(s.hit+s.miss)===0)unseen.push(o);
      else if(s.miss/(s.hit+s.miss)>=0.4)weak.push(o);
      else solid.push(o);
    });
    return [...shuffle(weak),...shuffle(unseen),...shuffle(solid)];
  },[]);
  const [i,setI]=useState(0);
  const [reveal,setReveal]=useState(false);
  const [score,setScore]=useState({hit:0,miss:0});
  const mark=(hit)=>{
    const o=objs[i];
    if(o){
      const s=AppState.drillStats[o.id]||(AppState.drillStats[o.id]={hit:0,miss:0});
      hit?s.hit++:s.miss++;s.ts=Date.now();
      saveState("drillStats");
    }
    setScore(s=>hit?{...s,hit:s.hit+1}:{...s,miss:s.miss+1});setReveal(false);setI(x=>x+1);
  };
  const weakSpots=()=>{
    const all=allObjections();
    return Object.entries(AppState.drillStats)
      .map(([id,s])=>({id,rate:s.miss/(s.hit+s.miss||1),n:s.hit+s.miss}))
      .filter(x=>x.n>=2&&x.rate>=0.4)
      .sort((a,b)=>b.rate-a.rate)
      .map(x=>{const o=all.find(o=>o.id===x.id);return o?o.name:null})
      .filter(Boolean).slice(0,3);   /* resolve deleted objections BEFORE taking top 3 */
  };
  useHotkeys(e=>{
    if(e.key==="Escape"){onExit();return true}
    if(!objs[i]||i>=objs.length){if(e.key==="Enter"||e.key===" "){onExit();return true}return false}
    if(!reveal&&(e.key===" "||e.key==="Enter")){setReveal(true);return true}
    if(reveal&&e.key==="1"){mark(true);return true}
    if(reveal&&e.key==="2"){mark(false);return true}
    /* a stray digit must not nav away and abort the drill */
    if(/^[1-9]$/.test(e.key)||e.key===" ")return true;
    return false;
  });
  const o=objs[i];
  if(!o||i>=objs.length)return h("div",{className:"stage anim-pop",style:{maxWidth:560,margin:"0 auto",textAlign:"center"}},
    h("div",{className:"blk",style:{padding:"30px"}},
      h("div",{className:"disp",style:{fontSize:28}},"DRILL COMPLETE"),
      h("div",{className:"bigstat",style:{fontSize:54,color:"var(--go)",margin:"12px 0"}},score.hit+"/"+(score.hit+score.miss)),
      h("div",{className:"mono dim",style:{fontSize:11,marginBottom:16}},"Top performers land 5.7 objection responses per call. Bottom performers land 1.8.\nReps who drill daily close the gap."),
      (()=>{const w=weakSpots();return w.length?h("div",{className:"blk-flat",style:{padding:"10px 12px",marginBottom:14,borderColor:"var(--alarm)",textAlign:"left"}},
        h("div",{className:"eyebrow",style:{color:"var(--alarm)",marginBottom:4}},"YOUR WEAK SPOTS — THEY COME UP FIRST NEXT DRILL"),
        w.map((n,j)=>h("div",{key:j,style:{fontSize:11.5,lineHeight:1.7}},"✕ "+n))):null})(),
      h("button",{className:"btn big primary",onClick:onExit},"DONE",h(Kbd,{k:"ENTER",btn:true}))));
  return h("div",{className:"stage anim-up",style:{maxWidth:680,margin:"0 auto"}},
    h("div",{className:"row",style:{marginBottom:16}},
      h("span",{className:"stamp",style:{color:"var(--sig)"}},"DRILL "+(i+1)+"/"+objs.length),
      h("span",{className:"mono",style:{fontSize:11,color:"var(--go)"}},"✓ "+score.hit),
      h("span",{className:"mono",style:{fontSize:11,color:"var(--alarm)"}},"✕ "+score.miss),
      h("div",{className:"grow"}),
      h("button",{className:"btn sm ghost",onClick:onExit},"EXIT",h(Kbd,{k:"ESC",btn:true}))),
    h("div",{className:"blk",style:{padding:"26px 24px",textAlign:"center",marginBottom:14}},
      h("div",{className:"eyebrow",style:{marginBottom:10}},"PROSPECT SAYS…"),
      h("div",{className:"disp",style:{fontSize:30,lineHeight:1.15}},'"'+o.name+'"'),
      (()=>{const s=AppState.drillStats[o.id];return s&&s.miss>0&&s.miss/(s.hit+s.miss)>=0.4?h("div",{className:"stamp",style:{color:"var(--alarm)",marginTop:8}},"WEAK SPOT · MISSED "+s.miss+"×"):null})(),
      h("div",{className:"mono dim",style:{fontSize:10,marginTop:8}},"Say your response OUT LOUD. Then reveal.")),
    !reveal?h("button",{className:"btn big primary",style:{width:"100%"},onClick:()=>setReveal(true)},"REVEAL THE TRACK",h(Kbd,{k:"SPACE",btn:true}))
    :h("div",{className:"anim-pop"},
      h("div",{className:"blk-flat",style:{padding:"12px 14px",marginBottom:10}},
        h("div",{className:"mono dim",style:{fontSize:10,marginBottom:8}},o.what),
        h("div",{style:{fontSize:12.5,lineHeight:1.65,marginBottom:8}},h("b",{className:"mono",style:{color:"var(--sig)",fontSize:9}},"TRACK 1 · "),o.t1),
        o.t2&&h("div",{style:{fontSize:12.5,lineHeight:1.65}},h("b",{className:"mono",style:{color:"var(--steel)",fontSize:9}},"TRACK 2 · "),o.t2)),
      h("div",{className:"grid g2",style:{gap:10}},
        h("button",{className:"btn big go",onClick:()=>mark(true)},"✓ I HAD IT",h(Kbd,{k:"1",btn:true})),
        h("button",{className:"btn big alarm",onClick:()=>mark(false)},"✕ MISSED IT",h(Kbd,{k:"2",btn:true})))));
}
function TObjections({initial}){
  const [,force]=useState(0);
  const [q,setQ]=useState(initial&&initial.q?initial.q:"");
  const [modal,setModal]=useState(null);
  const [drill,setDrill]=useState(!!(initial&&initial.drill));
  if(drill)return h(DrillMode,{onExit:()=>setDrill(false)});
  const objs=allObjections().filter(o=>!q||(o.name+" "+o.tag+" "+(o.what||"")+" "+(o.t1||"")).toLowerCase().includes(q.toLowerCase()));
  const save=(f)=>{
    if(modal==="new")AppState.customObjections.push({...f,id:uid(),custom:true});
    else Object.assign(modal,f);
    saveState("customObjections");setModal(null);force(x=>x+1);
  };
  return h("div",{className:"stage anim-up"},
    modal&&h(ObjForm,{initial:modal==="new"?null:modal,onSave:save,onCancel:()=>setModal(null)}),
    h("div",{className:"pagehead"},
      h("h1",null,"Objection Gym"),
      h("span",{className:"mono dim",style:{fontSize:11}},'validate first ("fair" / "makes sense") = 2x conversion'),
      h("div",{className:"grow"}),
      h("button",{className:"btn",onClick:()=>setModal("new")},"+ BUILD OBJECTION"),
      h("button",{className:"btn primary",onClick:()=>setDrill(true)},"🔥 DRILL MODE")),
    h("div",{style:{marginBottom:14,maxWidth:420}},h(SearchBox,{value:q,onChange:setQ,placeholder:'Search: "email", "budget", "SAP", "gatekeeper"…'})),
    h("div",{className:"mono dim",style:{fontSize:10,marginBottom:12}},'THE BIG 3 BY FREQUENCY: "not interested" 38% · "send me an email" 25% · "call back later" 18%'),
    h("div",{className:"grid g2"},
      objs.map(o=>h("div",{key:o.id,className:"blk",style:{padding:"13px 15px"}},
        h("div",{className:"row",style:{marginBottom:6}},
          h("b",{style:{fontFamily:"var(--mono)",fontSize:12.5}},o.name),
          h("span",{className:"stamp",style:{fontSize:8,color:"var(--amber)"}},o.tag),
          (()=>{const s=AppState.drillStats[o.id];if(!s||!(s.hit+s.miss))return null;
            const weak=s.miss/(s.hit+s.miss)>=0.4;
            return h(F,null,
              h("span",{className:"mono dim",style:{fontSize:9},title:"Your drill record"},"✓"+s.hit+" ✕"+s.miss),
              weak&&h("span",{className:"stamp",style:{fontSize:7.5,color:"var(--alarm)"}},"WEAK SPOT"));})(),
          h("div",{className:"grow"}),
          o.custom&&h("button",{className:"btn sm ghost",onClick:()=>setModal(o)},"✎"),
          o.custom&&h("button",{className:"btn sm ghost",onClick:()=>{AppState.customObjections=AppState.customObjections.filter(x=>x.id!==o.id);saveState("customObjections");force(x=>x+1)}},"✕")),
        h("div",{className:"mono dim",style:{fontSize:10,lineHeight:1.55,marginBottom:8}},o.what),
        h(CopyBit,{text:o.t1,style:{marginBottom:6}},h("div",{style:{fontSize:12,lineHeight:1.6}},h("b",{className:"mono",style:{color:"var(--sig)",fontSize:9}},"T1 · "),o.t1)),
        o.t2&&h(CopyBit,{text:o.t2},h("div",{style:{fontSize:12,lineHeight:1.6}},h("b",{className:"mono",style:{color:"var(--steel)",fontSize:9}},"T2 · "),o.t2))))));
}
</script>

<script>
"use strict";
/* ================= MESSAGES (template studio) ================= */
const VARS=["first_name","company","persona","pain","case_study","case_study_short","my_name","my_number","day_time"];
function TMessages({initial}){

  const tpls=getTemplates();
  const [selId,setSelId]=useState(initial&&initial.sel?initial.sel:(tpls[0]?tpls[0].id:null));
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(null);
  const [fill,setFill]=useState({first_name:"",company:"",persona:"",pain:"",case_study:"",case_study_short:"",my_name:AppState.settings.name,my_number:AppState.settings.number,day_time:""});
  const [targetPick,setTargetPick]=useState("");

      const out=await askClaude(prompt,700);
      startEdit({...tpl,body:out.trim()});
      toast("AI DRAFT READY — REVIEW & SAVE");
    }catch(e){toast(e.message==="NO_KEY"?"ADD YOUR ANTHROPIC KEY IN FORGE":"AI ERROR — "+e.message.slice(0,40))}
    setAI({busy:false});
  };
  const chGroups=[["email","EMAIL"],["linkedin","LINKEDIN"],["voicemail","VOICEMAIL"],["sms","SMS"]];
  return h("div",{className:"split"},
    h("div",{className:"split-list"},
      h("div",{style:{padding:"12px 12px 10px",borderBottom:"2px solid var(--line)"}},
        h("div",{className:"eyebrow",style:{marginBottom:6}},"MESSAGE STUDIO"),
        h("div",{className:"mono dim",style:{fontSize:9.5,lineHeight:1.5}},"Templates with {{variables}}. Build your own, fill, copy, fire.")),
      h("div",{style:{flex:1,overflowY:"auto"}},
        chGroups.map(([ch,label])=>{

              h("b",{style:{fontSize:11.5}},t.name),
              t.subj&&h("div",{className:"mono dim",style:{fontSize:9}},t.subj))));
        }))),
    h("div",{className:"split-body"},
      !tpl?h(Empty,{icon:"✉️",title:"No template selected"}):
      editing?h("div",{className:"anim-up",style:{maxWidth:720}},

            [["first_name","FIRST NAME"],["company","COMPANY"],["persona","PERSONA"],["pain","PAIN"],["day_time","DAY / TIME"],["my_number","YOUR NUMBER"]].map(([k,l])=>h(Field,{key:k,label:l},h("input",{style:{width:"100%"},value:fill[k]||"",onChange:e=>setFill({...fill,[k]:e.target.value})})))),

            h("div",{className:"row",style:{marginTop:12,flexWrap:"wrap"}},
              h("button",{className:"btn primary",onClick:()=>copyText((previewSubj?"Subject: "+previewSubj+"\n\n":"")+preview,"MESSAGE COPIED")},"⧉ COPY FULL MESSAGE"),

            h("div",{className:"mono dim",style:{fontSize:9.5,marginTop:12,lineHeight:1.6}},"Unfilled {{variables}} stay visible so you never send a broken merge."))))));

<script>
"use strict";
/* ================= CADENCE ================= */
function StepForm({initial,onSave,onCancel}){
