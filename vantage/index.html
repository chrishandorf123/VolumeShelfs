<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>VANTAGE — Cold Call Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7E9E4; --panel:#F7F8F4; --panel2:#EEF0EA; --ink:#171A1E; --ink2:#3C4148; --dim:#8A9099;
  --line:#171A1E; --hair:#C9CDC4;
  --sig:#FF4D00; --sigbg:#FFE9DF;
  --steel:#1D5FBF; --steelbg:#E3ECFA;
  --go:#149657; --gobg:#E1F3E9;
  --amber:#E89B00; --amberbg:#FBF0D9;
  --alarm:#D92D20; --alarmbg:#FBE4E2;
  --violet:#6D3FC4; --violetbg:#EEE7FA;
  --disp:'Archivo',sans-serif; --body:'Archivo',sans-serif; --mono:'IBM Plex Mono',monospace;
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:2px 2px 0 var(--ink);
}
[data-mode="dial"]{
  --bg:#0F1216; --panel:#171B21; --panel2:#1E232B; --ink:#F2F4F0; --ink2:#C3C9CF; --dim:#6E767F;
  --line:#F2F4F0; --hair:#2C323B;
  --sigbg:#3A1A0A; --steelbg:#12233F; --gobg:#0D2C1D; --amberbg:#33260A; --alarmbg:#3A1412; --violetbg:#251540;
  --shadow:4px 4px 0 #000; --shadow-sm:2px 2px 0 #000;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--sig);color:#fff}
button{font-family:inherit;color:inherit}
input,textarea,select{font-family:var(--mono);font-size:12px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:7px 9px;outline:none;border-radius:0}
input:focus,textarea:focus,select:focus{box-shadow:var(--shadow-sm);border-color:var(--sig)}
input::placeholder,textarea::placeholder{color:var(--dim)}
textarea{resize:vertical;line-height:1.6}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--hair);border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--dim)}
*:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

/* ---- primitives ---- */
.blk{background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow)}
.blk-flat{background:var(--panel);border:2px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow-sm);padding:8px 14px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .06s,box-shadow .06s;user-select:none;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--sig);color:#fff;border-color:var(--ink)}
.btn.go{background:var(--go);color:#fff}
.btn.steel{background:var(--steel);color:#fff}
.btn.alarm{background:var(--alarm);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--hair)}
.btn.ghost:hover{border-color:var(--line);box-shadow:var(--shadow-sm)}
.btn.big{padding:14px 22px;font-size:14px}
.btn.sm{padding:4px 9px;font-size:9px;box-shadow:none}
.btn.sm:hover{box-shadow:2px 2px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.stamp{display:inline-block;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1.5px solid currentColor}
.eyebrow{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.disp{font-family:var(--disp);font-weight:850;letter-spacing:-.01em;text-transform:uppercase}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .ink2{color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.hr{border:none;border-top:2px solid var(--hair);margin:12px 0}
.copy-flash{animation:flash .5s}
@keyframes flash{0%{background:var(--gobg)}100%{}}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
.anim-up{animation:slideup .22s ease both}
.anim-pop{animation:pop .16s ease both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- layout ---- */
#app{display:flex;height:100%;width:100%}
.rail{width:78px;flex-shrink:0;background:var(--panel);border-right:2px solid var(--line);display:flex;flex-direction:column;align-items:stretch;z-index:30}
.rail-logo{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--line);background:var(--ink);color:var(--bg);font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:-.02em}
[data-mode="dial"] .rail-logo{background:var(--sig);color:#fff}
.rail-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 2px 9px;background:transparent;border:none;border-bottom:1px solid var(--hair);cursor:pointer;color:var(--dim)}
.rail-btn .ri{font-size:17px;line-height:1}
.rail-btn .rl{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.08em}
.rail-btn:hover{color:var(--ink);background:var(--panel2)}
.rail-btn.on{color:var(--ink);background:var(--bg)}
.rail-btn.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sig)}
.rail-foot{margin-top:auto;border-top:2px solid var(--line);padding:8px 6px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.andon{height:56px;flex-shrink:0;background:var(--ink);color:#F2F4F0;border-bottom:2px solid var(--line);display:flex;align-items:stretch;overflow-x:auto}
[data-mode="dial"] .andon{background:#000}
.andon-cell{display:flex;flex-direction:column;justify-content:center;padding:0 16px;border-right:1px solid #333;min-width:86px}
.andon-cell .al{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:#8A9099;text-transform:uppercase}
.andon-cell .av{font-family:var(--disp);font-weight:900;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.andon-clock{margin-left:auto;display:flex;align-items:center;gap:12px;padding:0 16px}
.stage{flex:1;overflow-y:auto;padding:20px 24px 60px;position:relative}
.pagehead{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-family:var(--disp);font-weight:900;font-size:30px;letter-spacing:-.01em;text-transform:uppercase}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.split{display:flex;gap:0;height:calc(100vh - 58px);overflow:hidden}
.split-list{width:300px;flex-shrink:0;border-right:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.split-body{flex:1;overflow-y:auto;padding:18px 22px 60px;min-width:0}
.list-item{padding:10px 12px;border-bottom:1px solid var(--hair);cursor:pointer;border-left:4px solid transparent}
.list-item:hover{background:var(--panel2)}
.list-item.on{background:var(--bg);border-left-color:var(--sig)}
.qcard{border:2px solid var(--line);background:var(--panel);padding:12px 14px;position:relative}
.qcard .qtag{position:absolute;top:-2px;right:-2px;font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.1em;padding:2px 7px;background:var(--ink);color:var(--bg)}
.copybit{cursor:pointer;border:1.5px dashed var(--hair);padding:9px 11px;transition:border-color .1s;position:relative}
.copybit:hover{border-color:var(--sig)}
.copybit::after{content:"COPY";position:absolute;top:4px;right:6px;font-family:var(--mono);font-size:8px;font-weight:700;color:var(--dim);opacity:0;letter-spacing:.1em}
.copybit:hover::after{opacity:1;color:var(--sig)}
.tabbar{display:flex;gap:0;border:2px solid var(--line);width:max-content;max-width:100%;overflow-x:auto;background:var(--panel)}
.tabbar button{padding:7px 14px;border:none;border-right:2px solid var(--line);background:transparent;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--dim);white-space:nowrap}
.tabbar button:last-child{border-right:none}
.tabbar button.on{background:var(--ink);color:var(--bg)}
.modal-veil{position:fixed;inset:0;background:rgba(15,18,22,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:2px solid var(--line);box-shadow:6px 6px 0 var(--ink);max-width:640px;width:100%;max-height:86vh;overflow-y:auto;padding:20px}
.kbd{font-family:var(--mono);font-size:9px;border:1.5px solid var(--hair);padding:1px 5px;color:var(--dim)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:11px;font-weight:700;padding:9px 18px;z-index:200;box-shadow:var(--shadow);animation:slideup .2s ease}
.bigstat{font-family:var(--disp);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:14px;background:var(--panel2);border:1.5px solid var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--sig)}
.disp-btn{border:2px solid var(--line);background:var(--panel);box-shadow:var(--shadow-sm);padding:13px 8px;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.06em;cursor:pointer;text-align:center;text-transform:uppercase;transition:transform .05s}
.disp-btn:hover{transform:translate(-1px,-1px)}
.disp-btn:active{transform:translate(2px,2px);box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;font-weight:600;padding:3px 8px;border:1.5px solid var(--hair);background:var(--panel);cursor:pointer;letter-spacing:.04em}
.chip.on{border-color:var(--line);background:var(--ink);color:var(--bg)}
.rail-btn .rk{position:absolute;top:3px;right:5px;font-family:var(--mono);font-size:7px;font-weight:700;color:var(--dim);opacity:.75}
.rail-btn.on .rk{color:var(--sig);opacity:1}
.kbd-btn{margin-left:7px;opacity:.75;color:inherit;border-color:currentColor}
@media(max-width:820px){
  .rail-btn .rk{display:none}
  #app{flex-direction:column}
  .rail{width:100%;height:auto;flex-direction:row;border-right:none;border-bottom:2px solid var(--line);overflow-x:auto;order:2;border-top:2px solid var(--line)}
  .rail-logo{height:auto;width:54px;flex-shrink:0;font-size:16px;border-bottom:none;border-right:2px solid var(--line)}
  .rail-btn{border-bottom:none;border-right:1px solid var(--hair);padding:8px 10px;flex-shrink:0}
  .rail-btn.on::before{left:0;right:0;top:auto;bottom:0;width:auto;height:4px}
  .rail-foot{display:none}
  .main{order:1;height:calc(100% - 54px)}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .split{flex-direction:column;height:auto;overflow:visible}
  .split-list{width:100%;max-height:240px;border-right:none;border-bottom:2px solid var(--line)}
  .split-body{padding:14px 14px 80px}
  .stage{padding:14px 14px 90px}
  .pagehead h1{font-size:24px}
  .andon-cell{min-width:70px;padding:0 10px}
  .andon-cell .av{font-size:18px}
}
</style>

<script>
window.VANTAGE_DATA={"PERSONAS":[{"title":"Economic Buyer","c":"#2563eb","openers":["Hey [Name], this is Chris from Tulip Interfaces. I know I'm catching you out of the blue. Tulip helps manufacturers modernize their operations. think live production visibility across every site, digital work instructions, and AI that actually runs on the floor. how are you getting a real-time picture of throughput across your plants right now?","Hey [Name], Chris from Tulip. I work with VP Ops and COOs running on ERP and MES platforms that don't give real-time cross-site visibility without a major IT project. We're that layer on top for live OEE, quality, and throughput across every plant. how you're getting a real-time picture of floor performance?","Hey [Name], Chris at Tulip. I saw [company] has been [expanding/adding headcount]. When ops scales fast, visibility breaks first. is that hitting you yet?","Hey [Name], Chris from Tulip. quick one. TICO cut inspection and rework 60%, Forrester 2023 study: 448% ROI. If cross-plant visibility or throughput is on your radar, worth 90 seconds?"],"cares":["Cross-site OEE & throughput","Cost per unit / margin","Scalable growth","Board-level digital ROI"],"pains":["No real-time cross-plant visibility","Siloed legacy data","Slow response to demand shifts","Can't quantify digital investments"],"pitch":"Single pane of glass across every site. real-time OEE, quality, throughput. TICO: 60% less inspection and rework. Forrester 2023 study: 448% ROI, <6mo payback. 90-day deploy vs 18-month legacy MES.","qs":["How do you get a real-time picture of production performance across your sites?","If your best plant ran like your worst. what does that gap cost you annually?","When you need a process change rolled out across every line, how long does that actually take end-to-end?","How do you quantify the ROI on operations technology investments for the board right now?","What's the single biggest operational bottleneck standing between you and your next growth milestone?"],"warn":"Lead with OUTCOMES. cost, speed, ROI. Don't say no-code. Speak CFO language.","thread":"'Who runs the floor day-to-day? Who owns quality?' → Plant Mgr + Quality Dir.","vm":"Hey [Name], Chris from Tulip. leaving a quick message. VP Ops in your space tell me cross-site visibility is the hardest problem to solve without a six-month IT project. We fixed that for TICO. 60% less inspection and rework. Forrester 2023 study: 448% ROI. 90-day deploy vs 18-month legacy MES. I'll send you a quick note. Chris at Tulip, [number]."},{"title":"CEO","c":"#e11d48","openers":["Hey [Name], this is Chris from Tulip Interfaces. I know I'm catching you out of the blue. Tulip helps manufacturers modernize their operations. think real-time visibility from every line to your desk, digital standard work, and AI actually running on the floor. quick gut check: is ops a live dashboard for you today, or a black box?","Hey [Name], Chris from Tulip. I work with CEOs in manufacturing running on ERP and MES platforms that don't give real-time visibility into what's actually happening on the floor. We're that layer on top that connects ops to leadership. live data from every line. how you're staying connected to floor performance?","Hey [Name], Chris at Tulip. 98% of manufacturers have started a digital transformation journey, but most stall because the floor can't execute the strategy. We fix that. Worth 90 seconds?","Hey [Name], Chris from Tulip. TICO's ops director calls Tulip 'a full-blown MES—customized for us.' Mitsubishi Electric just led Tulip's $120M round at a $1.3B valuation. IDC named Tulip a Leader in MES. VEKA cut quality escapes 88%. If your competitors are pulling ahead operationally, this is the reason why."],"cares":["Competitive differentiation through operational execution","Scalable growth without proportional headcount","Return on digital investment. ROI the board can see","Talent retention and workforce modernization","Digital transformation that actually reaches the floor"],"pains":["Ops is a black box. no real-time visibility","Digital initiatives stall below the leadership layer. the floor never changes","Legacy systems slow growth and make M&A integration painful","Can't attract or retain skilled operators. 2.1M unfilled mfg jobs by 2030. 28% annual turnover","Invested in transformation but can't point to what's actually different on the floor"],"pitch":"Tulip is the operating system for the factory floor. $1.3B valuation (Jan 2026). #1 MES. ABI Research, IDC MarketScape Leader. Gartner: 4.5 stars (highest rated MES). ABI Research: #1 Overall Leader MES Process Industries (Aug 2025). Leader in 20 analyst reports in 2025. Forrester: 448% ROI. SaaS, 90-day deploy vs 18-month legacy MES. Think Big. Start Small. Go Fast. Composable Operations. one line, one use case, prove it in 90 days, then scale across every site. Your ops team becomes a competitive weapon.","qs":["What's your biggest operational constraint to hitting your growth targets this year?","How much visibility do you personally have into what's happening on the production floor day to day?","When you look at your best plant versus your worst. what's driving that performance gap?","Where does digital investment tend to stall in your organization. is it at leadership or on the floor?","If someone asked you today whether your digital transformation has actually changed how the floor operates. what would you say?"],"warn":"Don't pitch technology. Pitch competitive position, growth, and financial return. Get to the economic pain fast. their time is extremely limited. Winter's test: 'If your tech disappeared tomorrow, would anything change?'. if they hesitate, that's your opening.","thread":"'Who owns ops execution? Who owns the P&L at the plant level?' → VP Ops + Plant Mgr + Controller.","vm":"Hey [Name], Chris from Tulip. quick voicemail. CEOs I talk to in manufacturing say the floor is their biggest blind spot. decisions made on week-old data. 98% started DX but 73% stall before the floor. Industry 5.0: human-centric AI augmenting workers. We fixed that for TICO. 60% less inspection and rework. Forrester 2023 study: 448% ROI. Worth 20 minutes. I'll email you. Chris at Tulip, [number]."},{"title":"Director of Manufacturing","c":"#2563eb","openers":["Hey [Name], this is Chris from Tulip Interfaces. I know I'm catching you out of the blue. Tulip helps manufacturers modernize their operations. think digital work instructions, live OEE across every line and shift, and AI on the floor. are your supervisors still managing by walking around, or do they see it live?","Hey [Name], Chris from Tulip. I work with directors of manufacturing where floor systems that don't give shift-level or line-level visibility without pulling reports. We're that layer on top for real-time throughput and execution consistency. how you're getting visibility into floor performance across shifts and lines?","Hey [Name], Chris at Tulip. A peer of yours went from paper to a 60% cut in quality inspection and rework. no new ERP, no systems integrator. Worth 60 seconds to hear how?","Hey [Name], Chris from Tulip. You're accountable for output across every line. We give you the real-time visibility to actually manage to that number. Worth a quick conversation?"],"cares":["Plant-level OEE and throughput","Labor productivity and utilization","Quality and rework costs","Consistent execution across shifts and lines"],"pains":["No real-time cross-shift or cross-line visibility","Supervisors manage by walking around. not data","Inconsistent execution between operators and shifts","Can't scale best practices from one line to all"],"pitch":"Real-time dashboards for every line, shift, and operator. Digital standard work ensures consistency. TICO: 60% less quality inspection and rework. Deploy one line in 90 days. expand without IT.","qs":["How do you get visibility into floor performance across shifts and lines today. system, walk, or morning meeting?","Where's the biggest execution gap between your best and worst-performing line or shift?","When something goes wrong on the floor, how quickly do you know, and how do you find out?","How long does it take to roll a process improvement from one line to all of them?","Where does tribal knowledge live today. is it documented, or does it walk out when someone leaves?"],"warn":"They are accountable for output. speak OEE, throughput, shift performance. Don't lead with technology. Lead with operational control.","thread":"'Who owns quality below you? Who manages the plant day-to-day?' → Quality Dir + Plant Mgr.","vm":"Hey [Name], Chris from Tulip. quick voicemail. Directors of manufacturing I talk to are caught between leadership pushing for more throughput and a floor still running on paper. We helped one customer go from paper to 60% less quality inspection and rework. no new ERP. Worth 60 seconds of your time. I'll email you. Chris at Tulip, [number]."},{"title":"CTO","c":"#7c3aed","openers":["Hey [Name], this is Chris from Tulip Interfaces. I know I'm catching you out of the blue. Tulip helps manufacturers modernize their operations. think composable apps instead of a monolithic MES, clean structured floor data, and AI that actually runs in production. is your floor data clean enough today that you'd feed it to a model?","Hey [Name], Chris from Tulip. I work with CTOs in manufacturing where every other system has been modernized but the shop floor is still on a legacy MES or paper. We're that composable layer on top. no-code, cloud-native, open API, ops builds the apps. how you're thinking about modernizing the floor technology stack?","Hey [Name], Chris at Tulip. Industrial AI is a $43B market growing to $154B by 2030 growing to $154 billion by 2030, but the bottleneck isn't the algorithm. It's the data foundation and integration layer underneath it. We build that layer. Worth 20 minutes?","Hey [Name], Chris from Tulip. Mitsubishi Electric led our $120M Series D in Jan 2026 :"ION is a strong choice if you're a startup team of 10 engineers building spacecraft in a garage. Once you're scaling a real production floor. multiple lines, multiple shifts, IoT-connected equipment, regulated quality requirements. you need Tulip. We have 1,000+ sites, 60,000+ frontline workers, Forrester-validated 448% ROI, and an IoT-native edge runtime that connects every device on your floor. Your team builds the apps. No vendor queue.","mines":["How many production sites and operators are you planning to scale to, and does your current platform have reference customers at that scale?","Are your machines and smart tools feeding data directly into your current system, or is operator entry still manual?","What's the business case you're taking to leadership. do you have independent ROI data to support the investment?"]},{"n":"Fulcrum","t":"ERP/MES/MRP · SMB Job Shops & Machine Shops","c":"#d97706","ack":"Modern, intuitive UX that SMB shops actually adopt · All-in-one: ERP + MES + MRP + scheduling in one platform · AI-powered job scheduling engine · No per-user pricing · Fast onboarding with dedicated launch team · Good fit for CNC shops, sheet metal, precision machining","atk":["Built for small-to-mid-sized job shops. not designed for enterprise discrete manufacturers, regulated environments, or multi-site ops","ERP-first, not floor-first. operator guidance, IoT connectivity, and guided work instructions are limited compared to Tulip","No composable app building. manufacturers can't create custom floor applications without Fulcrum involvement","Weak on compliance. AS9100, FDA 21 CFR Part 11, ITAR, GxP not purpose-built","Limited IoT/smart tool connectivity. machine data integration is not a core capability","Primarily a scheduling and job tracking system, not a platform for quality management, traceability, or operator workflow automation at scale","Small company with limited enterprise reference customers. harder to justify for large ops budgets"],"win":"Fulcrum is the right tool for a 20-person machine shop that needs to replace spreadsheets and get job tracking under control. If you're a manufacturer with 50+ operators, regulated quality requirements, IoT-connected equipment, and a need for real-time guided workflows. that's Tulip. We're composable, IoT-native, Forrester-validated 448% ROI, and your engineers build their own apps. Fulcrum is a job shop ERP. Tulip is a frontline operations platform.","mines":["How many operators are on your floor, and how many production sites are you managing?","Are you in a regulated environment. AS9100, FDA, ITAR. where traceability and audit trails are a hard requirement?","Does your current system connect to your machines and smart tools on the floor, or is data still entered manually?"]},{"n":"Mendix","t":"Low-Code App Platform · IT-Led Custom Development","c":"#0284c7","ack":"Powerful enterprise low-code platform. owned by Siemens · Can build virtually any application with the right developer · Strong data modeling and integration capabilities · Enterprise governance and security · Deployed at 4,000+ companies · Cloud-native, multi-environment deployment","atk":["Not a manufacturing platform. Mendix is a general-purpose app dev tool that requires developers to build anything manufacturing-specific","IT-led, not ops-led. manufacturing engineers cannot build or change apps themselves; requires trained Mendix developers","No manufacturing primitives out of the box. no guided work instructions, no IoT edge runtime, no quality workflows, no operator UX templates","Long build cycles. implementations take months, not 90 days; every new use case is a new development project","High TCO. developer cost + license + SI + maintenance easily exceeds Tulip's Forrester-validated ROI model","No frontline operator focus. built for general enterprise apps, not for guiding operators on a production floor","Becomes technical debt. every custom app your IT team builds they now have to maintain forever"],"win":"Mendix is what IT chooses when they want to build their own solution. The problem is that every workflow change is a development ticket, every new use case is a 3-month project, and operators are still waiting on IT. Tulip flips that model. your manufacturing engineers build and own the apps, no developers needed. We're purpose-built for the floor: IoT-native, guided work instructions, quality workflows, and real-time visibility out of the box. Forrester: 448% ROI, 90-day deploy vs 18-month legacy MES. Mendix builds apps. Tulip runs factories.","mines":["Who actually builds and maintains the apps in your current Mendix environment. IT developers, or the ops team?","When a process changes on the floor, how long does it take to get that change into the app. days, weeks, or months?","What's the fully-loaded cost of your Mendix environment including developer time and maintenance, and how does that compare to the business case you built for it?"]},{"n":"Critical Manufacturing","t":"MES · High-Tech / Electronics / Semiconductor","c":"#0d9488","ack":"Gartner Magic Quadrant presence · Purpose-built for high-tech, electronics, semiconductor, and medical device manufacturing · Strong closed-loop quality and traceability · Deep compliance capabilities (FDA, ISO, IPC) · Enterprise-grade with ASMPT backing · Good data and analytics layer","atk":["Designed for high-volume, high-complexity electronics and semiconductor, not a natural fit for discrete assembly, A&D, or industrial manufacturing","Enterprise-first architecture. heavy implementation, long timelines, IT-led deployments","Not composable or no-code. ops teams cannot build and modify apps without IT or Critical Manufacturing involvement","Strong in data management, weak in operator-facing guided workflows. floor UX is not the core product","Limited IoT edge runtime for real-time smart tool and machine connectivity compared to Tulip's native edge layer","High TCO. enterprise licensing, SI dependency, and lengthy onboarding create a high barrier to value","Best-suited for large semiconductor and electronics OEMs. overkill and over-engineered for manufacturers who need speed and flexibility"],"win":"Critical Manufacturing is a serious platform for a TSMC or a large electronics OEM running complex, high-volume semiconductor processes. If that's you. it deserves a look. But if you're a discrete manufacturer who needs to deploy in 90 days, give your ops team the ability to build their own workflows, connect IoT devices and smart tools, and start seeing ROI in weeks. that's Tulip. We're composable: 'Think Big. Start Small. Go Fast. Composable Operations.' One line, one use case, 90 days, then expand. Forrester: 448% ROI. Your team builds the apps. No vendor required.","mines":["Is your production environment primarily semiconductor or electronics manufacturing, or are you running discrete assembly, mixed-mode, or industrial OEM operations?","When your ops team needs to update a workflow or add a new use case, who builds that. internal developers, a systems integrator, or Critical Manufacturing?","What does your implementation timeline and TCO estimate look like, and how quickly do you expect to see measurable ROI?"]},{"n":"Gartner on Tulip — Know Thyself","t":"Analyst prep · 2022 MQ","c":"#6D3FC4","ack":"Sharp competitors quote Gartner's May 2022 MES MQ cautions about Tulip. Know them cold, answer honestly, and date-stamp them — a lot changed by 2026.","atk":["'Gartner says MES-specific processes often need additional effort by the customer or a Tulip partner.' (2022 MQ, real quote)","'Gartner says Tulip's flexibility requires governance and discipline.' (2022 MQ, real quote)","'Gartner customers said Tulip is often nearly as expensive as the solution it's replacing.' (2022 MQ, real quote)"],"win":"Date-stamp first: those cautions are May 2022, and the same report rated Tulip a Challenger while endorsing the app-library approach as aligned with Gartner's own composability vision — Gartner predicted 60% of new MES would be assembled from composable technology by 2025. Since then IDC's 2024–25 MarketScape named Tulip a LEADER in worldwide MES. On cost: compare full TCO — integrators, change orders, revalidation cycles — that's where legacy MES spend hides, and 'nearly as expensive' with 10x the adaptability is a strange objection. On governance: correct, and that's the design — IT governs the platform, ops builds inside the guardrails.","mines":["When Gartner called composability the future of MES, which side of that prediction is your current vendor on?","Ask any legacy MES vendor what a mid-project scope change costs. Flexibility that 'requires discipline' beats rigidity that requires change orders."]}],"CHECKLIST_PHASES":[{"id":"book","label":"Book","icon":"📅","color":"#2563eb","subtitle":"Lock in the meeting and confirm attendance","items":[{"id":"cal","text":"Send calendar invite with Zoom/Teams link","tip":"Include a 1-line agenda so they know what to expect. Subject: '[Company] × Tulip. 20 min intro'"},{"id":"calconf","text":"Confirm invite was accepted","tip":"If not accepted within 24hrs, send a quick reply: 'Just checking the invite landed. let me know if timing works.'"},{"id":"email1","text":"Send confirmation email with context","tip":"Keep it short: who you are, what you'll cover, what to expect. Attach one relevant case study (TICO, Pratt Miller, Forrester TEI)."},{"id":"cstudypick","text":"Pick the right case study for this account","tip":"A&D → Pratt Miller. Industrial OEM → TICO. Regulated/pharma → Sharp. Budgetary → Forrester TEI. Quality → Med Device."},{"id":"linkedin","text":"Connect with attendees on LinkedIn","tip":"Do this before the meeting. they'll see your profile before you call. Mention Tulip in your headline."}]},{"id":"prep","label":"Prep","icon":"🧠","color":"#7c3aed","subtitle":"Walk in knowing more than they expect","items":[{"id":"research","text":"Run the company through the Research tab","tip":"Use the Research tab to pull recent news, likely systems, pain points, and the best opener angle before you dial."},{"id":"persona","text":"Identify the persona(s) attending and review their card","tip":"Look up each attendee in the Playbook tab. Know their pain points, what to avoid, and the multi-threading angle."},{"id":"discov","text":"Pick 3–5 discovery questions for this meeting","tip":"Use the Discovery tab. Choose from Current Tech Stack + Production Challenges at minimum. Don't wing it."},{"id":"competitors","text":"Check if they have a known competitor or incumbent MES","tip":"Review their likely_systems from Research. Pull the relevant Battle Card in Playbook so you're ready if it comes up."},{"id":"pain","text":"Identify the #1 pain angle to lead with","tip":"Based on their industry and persona: Technical Buyer → escapes & audit. Plant Mgr → firefighting. VP Ops → throughput & ROI."},{"id":"agenda","text":"Set a clear agenda for yourself: intro → pain → pitch → next step","tip":"Intro (2 min) → let them talk about their world (8–10 min) → pitch relevant use case (3–4 min) → propose next step (2 min)."}]},{"id":"salesforce","label":"Salesforce","icon":"☁️","color":"#0891b2","subtitle":"Get the CRM right before and after","items":[{"id":"sfcontact","text":"Find or create the Contact in Salesforce","tip":"Search by name and company first. If new, add Title, Company, Phone, Email, and LinkedIn URL."},{"id":"sfaccount","text":"Find or create the Account record","tip":"Check for duplicates. search by company name and domain. Merge if needed. Update Industry and Employee Count."},{"id":"sfoppty","text":"Create the Opportunity in Salesforce","tip":"Stage: Prospecting. Name format: '[Company]. [Use Case]. [Year]'. Set Close Date and Amount estimate even if rough."},{"id":"sfactivity","text":"Log the meeting as an Activity on the Opportunity","tip":"Add meeting date, attendees, and a one-line subject. This timestamps your pipeline activity for your AE."},{"id":"sfnext","text":"Add a Task for your next follow-up action","tip":"Always create the next task before you close Salesforce. Due date = same day as your follow-up email send."}]},{"id":"ae","label":"AE Assignment","icon":"👤","color":"#0284c7","subtitle":"Loop in the right Account Executive","items":[{"id":"aecal","text":"Check AE calendar availability for demo/next step","tip":"Check before the meeting ends if possible. being able to say 'I have [AE name] available Thursday at 2pm' closes the next meeting on the spot."},{"id":"aematch","text":"Match AE to territory, industry, or account size","tip":"Consider vertical expertise: regulated/A&D, med device, general discrete. Enterprise deal size matters too."},{"id":"aeavail","text":"Confirm AE is available and briefed before assigning","tip":"Don't assign cold. Send AE a quick Slack/email: company name, persona, pain found, and your suggested next step."},{"id":"aeintro","text":"Introduce AE to prospect in the follow-up email","tip":"CC your AE on the follow-up. One sentence: 'I'm looping in [AE Name], who works with [similar companies] and will be joining our next call.'"}]},{"id":"followup","label":"Follow-Up","icon":"📨","color":"#059669","subtitle":"Close the loop and move the deal forward","items":[{"id":"fuemail","text":"Send follow-up email within 2 hours of meeting ending","tip":"Speed signals interest. Subject: 'Notes from our call + next step'. Reference something specific they said. it shows you listened. If they asked about ROI, drop this line: 'For every $1 invested in Tulip, we strive for $10 in return. Forrester: 448% ROI and <6 month payback independently.'"},{"id":"funotes","text":"Include a summary of what they shared (pain, context, team)","tip":"Example: 'Based on what you shared. [X lines], [Y operators], currently on [Z system]. here's why I think Tulip is relevant..' Make it feel tailored, not templated."},{"id":"fucs","text":"Attach the right case study or Forrester TEI link","tip":"Match to their pain: throughput → TICO, quality/compliance → Med Device or Pratt Miller, budget → Forrester TEI PDF."},{"id":"funextstep","text":"Propose a specific next step with date and time","tip":"Don't say 'let me know when you're free.' Say: 'I have [AE] available Thursday at 2pm or Friday at 10am. which works better?'"},{"id":"sfupdate","text":"Update Opportunity Stage in Salesforce","tip":"Move from Prospecting → Discovery if pain was confirmed. Add meeting notes to the Opportunity. Update Close Date if discussed."},{"id":"fuaebriefing","text":"Brief your AE on what was discovered","tip":"Send a Slack message or email: attendees, their pain (in their words), incumbent system, urgency/forcing function, and recommended next step."}]}],"CASE_STUDIES":[{"co":"Forrester TEI","tag":"ROI / Budget","color":"#0284c7","stats":["448% ROI / 3yr","$16.23M NPV","<6mo payback","15% labor productivity ↑","70% fewer defects","$318K vendor consolidation savings","50% indirect-labor time saved"],"use":"CFOs, Controllers, budget convos. when they ask for ROI proof. Drop: 'For every $1 in, we strive for $10 out.' NOTE: May 2023 study by Forrester Consulting, commissioned by Tulip — attribute as 'a 2023 Forrester study commissioned by Tulip.' Still the latest TEI as of July 2026."},{"co":"Tulip (company facts)","tag":"Momentum / Trust","color":"#FF4D00","stats":["$120M Series D (Jan 2026) led by Mitsubishi Electric — strategic alliance","$1.3B valuation — unicorn","43K apps · 60K frontline workers · 1K sites · 45 countries (2025)","Gen-AI adoption +364% · automations +519% in 2 yrs","IDC MarketScape 2024–25: LEADER, worldwide MES (first appearance)","Gartner 2022 MES MQ prediction: 60% of new MES assembled from composable tech by 2025"],"use":"Answers 'never heard of you' and 'will you be around?' — funding/scale company-reported (Jan 2026 release); IDC is third-party (Nov 2024). IDC's own line: recommended for companies 'somehow dissatisfied with traditional MES vendors.'"},{"co":"TICO Tractors","tag":"Throughput / OEM","color":"#059669","stats":["50–60% less quality inspection & rework","Paper → digital in 90 days","“We have a full-blown MES—customized for us without features we don't need.” — Dir. of Production Ops"],"use":"End Users, VP Ops, paper/Excel shops, industrial OEM, throughput conversations ⚠ Do NOT cite '60% less inspection and rework' — not on Tulip's current case page (July 2026)."},{"co":"VEKA","tag":"Quality / Escapes","color":"#149657","stats":["88% fewer quality escapes"],"use":"Quality-led calls (QA, quality engineers, plant managers). Verified live on tulip.co/case-studies July 2026."},{"co":"Innovafeed","tag":"Scale-Up / 500%","color":"#1D5FBF","stats":["Production up 500%","1,000 → 6,000 pallets/day"],"use":"Growth and scale-up conversations — CEO/CGO/ops. Verified live on tulip.co/case-studies July 2026."},{"co":"Sharp","tag":"Pharma / GxP / Speed","color":"#8b5cf6","stats":["30% faster clinical packaging","GxP-compliant guided workflows","Accelerated FDA audit readiness","Digital audit trails"],"use":"Pharma, contract manufacturing, clinical trials, FDA/GxP, QA conversations"},{"co":"Pratt Miller","tag":"A&D / Compliance","color":"#2563eb","stats":["Won new DoD contracts","Full digital traceability","Eliminated paper travelers","Adaptive to engineering shifts"],"use":"A&D, program managers, DCMA/ITAR, defense compliance conversations ⚠ VERIFY FIRST — not reconfirmed on Tulip's public case index (July 2026)."},{"co":"DMG MORI","tag":"NPI / Quick Win","color":"#7c3aed","stats":["Insights in 4 weeks","Engineers built it themselves","NPI cycle compressed"],"use":"Mfg Engineers, champions who need a fast proof point, NPI/ECN discussions"},{"co":"Med Device Co.","tag":"Quality / FDA","color":"#e11d48","stats":["90+ apps","MES + eDHR in 6 months","70% defect reduction","$1M+ operational cost savings"],"use":"Technical Buyers, FDA 21 CFR Part 11, regulated environments, budget conversations"},{"co":"AstraZeneca","tag":"Enterprise / Pharma","color":"#0891b2","stats":["24 global sites (⚠ unverified as of July 2026)","GxP-compliant deployment (historically cited)","Reconfirm before citing on a call"],"use":"Enterprise credibility, pharma, GxP, Annex 11, skeptical buyers, Head of Strategy ⚠ VERIFY FIRST — not on Tulip's public case index as of July 2026; reconfirm before citing."},{"co":"Protolabs","tag":"IoT / Machine Connect","color":"#ea580c","stats":["53% scrap reduction","Increased capacity","Faster response times","Machine connectivity"],"use":"CTOs, IT Directors, IoT/machine connectivity convos, smart manufacturing discussions. Quote: 'We've had great success connecting our machines to Tulip.'. Alex Klick, Sr. Mfg Engineer"},{"co":"Pharma Changeover","tag":"Pharma / Process","color":"#db2777","stats":["14 days → 3 days line clearance","78% changeover time reduction","80-page SOP → guided digital app","Reduced training time"],"use":"Pharma, process engineers, CI managers, Operations Managers where complex changeovers"},{"co":"Bloom Energy","tag":"MES Replacement","color":"#10b981","stats":["230+ stations","8-month deployment","Replaced legacy MES","Real-time throughput + cost data","Citizen development program launched"],"use":"MES replacement conversations, VP Ops, End Users, operations at scale, IoT"},{"co":"Stanley Black & Decker","tag":"Multi-Site / OEE","color":"#64748b","stats":["Multi-site EU deployment","Tiered OEE dashboards","Scrap and production tracking digitized","Continuous improvement enabled"],"use":"Multi-site manufacturers, Director of Manufacturing, CI Managers, European operations"},{"co":"Reframe Systems","tag":"Speed / Construction","color":"#6D3FC4","stats":["Builds homes 2.5x faster"],"use":"Speed-to-output proof for unconventional manufacturing. Verified July 2026."},{"co":"Zaleco","tag":"Scrap / Cost","color":"#E89B00","stats":["Scrap rate cut 20%"],"use":"Cost-of-quality and waste conversations. Verified July 2026."},{"co":"Formlabs","tag":"Lead Time","color":"#D92D20","stats":["Lead time cut 20%"],"use":"Throughput and lead-time conversations. Verified July 2026."},{"co":"Test Devices","tag":"Capacity / Testing","color":"#0891b2","stats":["Testing volume +50%"],"use":"Capacity proof for test/quality engineering. Verified July 2026."},{"co":"Deloitte 2026 Outlook","tag":"Budget / Urgency","color":"#171A1E","stats":["80% of manufacturers plan to invest 20%+ of improvement budgets in smart manufacturing","(Deloitte survey of 600 manufacturing executives, 2025)"],"use":"Third-party urgency for CFO/CEO/strategy: the budgets are moving industry-wide — is their floor ready? Deloitte 2026 Manufacturing Industry Outlook, published Nov 2025."}],"DISCOVERY":[{"id":"stack","label":"Current Tech Stack","color":"#2563eb","icon":"⚙️","subtitle":"Understand their existing systems before positioning Tulip","questions":[{"q":"Walk me through what operators actually use on the floor today. paper, screens, or a system?","why":"Starts conversationally and surfaces the single most important signal: paper/PDF = land fast, legacy MES = complement or displace. Gets them talking before you've asked anything threatening.","flags":{"green":["Paper binders","PDFs on shared drive","Printed travelers","No MES","Homegrown spreadsheets"],"red":["Just renewed MES contract in last 6 months","Deeply embedded Siemens Opcenter with dedicated in-house team"]}},{"q":"And behind that. what ERP are you running? SAP, Oracle, Epicor, IFS, Infor, Dynamics?","why":"Natural follow-on from floor systems. ERP identity drives the integration story. Tulip has deep connectors for all major ERPs. Sets up the 'we connect to what you already have' message.","flags":{"green":["SAP","Epicor","IFS","Infor","Oracle","Dynamics"],"red":["No ERP at all. may not be ready for Tulip","Fully homegrown ERP with no API access"]}},{"q":"Is there a QMS in the mix, and is it talking to the floor, or living in its own world?","why":"Disconnected QMS is the norm. Paper QMS = quality pain is live. The 'living in its own world' framing invites them to agree without feeling defensive.","flags":{"green":["Paper QMS","QMS disconnected from production floor","Quality data entered manually after the fact"],"red":["Fully integrated digital QMS with no expressed pain"]}},{"q":"Do you have any machine monitoring or SCADA running. Ignition, PI, FactoryTalk?","why":"Many manufacturers have machine data but no operator-facing layer. Tulip complements SCADA. it's the UX on top, not a replacement. Surfaces the 'data without context' pain naturally.","flags":{"green":["SCADA for machine data but no operator app layer","Ignition for dashboards only","PI historian with no floor workflow"],"red":[]}},{"q":"When engineering makes a change. a revision, an ECN. how does that actually get to the operator on the floor?","why":"ECN propagation lag is one of the most expensive and underappreciated pains in manufacturing. This question often triggers a candid, frustrated answer. Directly sets up Tulip's instant revision propagation story.","flags":{"green":["Manual. someone prints and walks it to the floor","Email to supervisors who update binders","Days or weeks to propagate"],"red":["Fully automated ECN-to-floor system already in place"]}},{"q":"And do you have a PLM. Teamcenter, Windchill, Enovia, or is engineering living in a different world from production?","why":"PLM disconnect from production = digital thread pain. Closes out the stack section with a question that naturally bridges to the NPI and ops profile sections.","flags":{"green":["PLM disconnected from production floor","Manual BOM transfer to production"],"red":[]}},{"q":"Across all of that. ERP, PLM, QMS, SCADA. if you brought in a new platform, do you feel confident you could connect it to the systems that matter, or are integrations a known headache?","why":"Surfaces integration readiness and IT gatekeeping risk early. If they say integrations are a nightmare, position Tulip's 60+ pre-built connectors and open API directly. If IT is a blocker, surfaces that now rather than late-stage.","flags":{"green":["Open to integrations","API-friendly IT environment","Already use cloud connectors","IT is a partner not a gatekeeper"],"red":["IT blocks all new integrations","Everything is on-prem with no API exposure","Previous integration projects took 12+ months"]}},{"q":"Last one on systems. how would you describe the quality of your floor data today? If I asked you to build an AI model on top of it, or make a major ops decision from it, would you trust it?","why":"57% of manufacturers cite data quality as their #1 barrier to scaling AI (MIT/IoT Analytics 2024). This question surfaces whether they have a data problem masquerading as a technology problem, and positions Tulip as the clean data foundation before AI is layered on. If they hesitate or laugh, that's Tulip's opening.","flags":{"green":["'Our data is pretty clean'","Already have a data warehouse or historian feeding analytics","Trust their ERP and floor data enough to make decisions from it"],"red":["'Honestly the data is a mess'","Manual data entry. no automated capture","Multiple conflicting systems with no single source of truth. data foundation problem, not just a workflow problem"]}}]},{"id":"ops","label":"Operations Profile","color":"#059669","icon":"🏭","subtitle":"Size the opportunity and understand their environment","questions":[{"q":"What kind of manufacturing are you running. discrete assembly, machine shop, A&D, medical, pharma, or a mix?","why":"Sets the context for everything else. Determines which use cases, compliance requirements, and case studies to lead with. Ask this first so every subsequent question lands in the right frame.","flags":{"green":["Discrete assembly","A&D / DoD regulated","Medical device","Industrial OEM","High-mix low-volume"],"red":["Pure continuous batch process with no assembly. harder fit"]}},{"q":"How many operators are touching the floor on a given day. roughly?","why":"Drives license count and deal size. 50+ = meaningful deal. 200+ = enterprise opportunity. Ask casually. 'roughly' takes the pressure off and gets a real number.","flags":{"green":["50–500+ operators","Multiple shifts running concurrently"],"red":["<10 operators. likely too small to prioritize"]}},{"q":"How many lines or work cells are you running, and are they all the same process or different?","why":"More lines = higher ACV and expansion potential. 'Same or different' surfaces complexity. high-mix = stronger Tulip fit. Each line/cell is a deployment unit.","flags":{"green":["5+ lines","Mix of assembly + machine shop + inspection","High-mix processes across cells"],"red":["Single bench operation with no expansion path"]}},{"q":"Are you running multiple shifts, and do you have one facility or several?","why":"Combines two profiling questions naturally. Multi-shift = shift handoff pain. Multi-site = Economic Buyer is your buyer, not just End User. Critical for deal size and positioning.","flags":{"green":["2+ shifts with variability across them","2+ facilities or global ops"],"red":[]}},{"q":"Roughly what's the revenue range. $50M, $500M, $5B?","why":"Sizes budget authority and urgency. $100M+ = meaningful budget. Growth companies adding headcount = ops strain = high urgency. Phrase it as a range so it doesn't feel like a finance interrogation.","flags":{"green":["$50M–$10B range","Growth company actively hiring or expanding capacity"],"red":["<$10M. may lack budget or operational complexity"]}},{"q":"And is ops currently a constraint on your growth, or is it keeping pace?","why":"Closes the profile section with a strategic open-door question. If they say 'constraint,' you've surfaced a VP Ops / CEO-level pain in two minutes. Their answer sets up the entire pain section that follows.","flags":{"green":["'Ops can't keep up with demand'","'We're hiring but not getting more output'","Throughput is the growth ceiling"],"red":["'Ops is running fine'. qualify further before continuing"]}}]},{"id":"pain","label":"Production Challenges","color":"#e11d48","icon":"🔥","subtitle":"Find the pain, quantify it, make it urgent","questions":[{"q":"Given what you just described. what's the one problem on the floor that's costing you the most right now?","why":"Flows naturally from the ops profile. 'Given what you just described' makes them feel heard and signals you're connecting the dots. Let them lead. their answer tells you the use case, the buyer, and the urgency.","flags":{"green":["Quality escapes or rework","Throughput / OEE shortfall","Inconsistent operator execution","Compliance gaps","Unplanned downtime"],"red":["'Things are pretty good', not a qualified opportunity yet, keep digging"]}},{"q":"How widespread is it. one line, a whole facility, or is it showing up everywhere?","why":"Quantifies scope without asking for a number directly. The broader the impact, the bigger the business case and the more executive urgency. Also surfaces whether it's a pilot or platform conversation.","flags":{"green":["Cross-shift or cross-site impact","50+ operators affected","Multiple lines or facilities touched"],"red":[]}},{"q":"Put a number on it if you can. what's it costing in scrap, rework, overtime, or missed shipments?","why":"Monetizes the pain. Without a number, there's no ROI story and no urgency for the CFO. Even a rough estimate works. If they can't answer, that's a discovery gap to address before moving forward.","flags":{"green":["Names a dollar amount or percentage","Downtime hours, rework rate, cost per escape"],"red":["'We don't track that'. blocker; probe further before moving on"]}},{"q":"How long has this been going on, and what have you already tried?","why":"Chronic pain with failed attempts = maximum urgency. If they've tried IT projects that stalled, Tulip's no-code speed is the sharpest differentiator. Also surfaces incumbent relationships and political landmines.","flags":{"green":["Problem exists 1+ years","Tried an IT project that stalled","Previous vendor or approach failed"],"red":["Brand new problem. may not have budget authority yet"]}},{"q":"If you fixed it. what does that actually unlock for the business?","why":"Gets them to articulate the outcome in their own words. Their answer becomes your proof-of-value framing in the follow-up email and AE brief. Don't fill in the answer. let them say it.","flags":{"green":["Specific outcome: 'X% more throughput', 'clean audit', 'no more overtime'"],"red":["Vague: 'just better visibility'. push for a metric"]}},{"q":"Is there a date on this. an audit, a contract deadline, a product launch that makes this urgent?","why":"Forcing functions are worth more than any ROI math. External deadlines create urgency that stalls disappear. If there's no date, that's the biggest risk to the deal cycle.","flags":{"green":["DCMA audit in Q2","FDA inspection pending","New product launch in 90 days","Contract renewal coming"],"red":["No timeline. deal will stall; plant the seed and stay warm"]}}]},{"id":"quality","label":"Quality & Compliance","color":"#7c3aed","icon":"✅","subtitle":"Identify regulatory exposure and audit readiness gaps","questions":[{"q":"What certifications are you holding or actively pursuing. AS9100, ISO 9001, FDA 21 CFR Part 11, ITAR, GxP?","why":"Certifications are a hard requirement list. Regulated companies need electronic records, traceability, and audit trails Tulip meets out of the box. Also immediately elevates the conversation beyond 'nice to have.'","flags":{"green":["AS9100","FDA 21 CFR Part 11","ITAR","ISO 13485","GxP / eBR"],"red":["No certifications, no plans. quality angle is weaker"]}},{"q":"How are you managing batch records, device history records, or electronic signatures right now?","why":"Paper DHRs and manual e-sigs are one of the most direct Tulip entry points. replaces them with fully compliant, auditable digital records. Surfaces the compliance pain in one question.","flags":{"green":["Paper batch records","Spreadsheet DHR","Manual signatures on paper travelers"],"red":["Fully compliant digital system already in place with no expressed pain"]}},{"q":"If I asked you right now to pull full traceability for a specific lot or serial number. how long does that take?","why":"The 'right now' framing makes it vivid. If the answer is hours or days, that's audit exposure and a clear Tulip win. The question also surfaces whether they're paper-first or system-first.","flags":{"green":["Hours to days","'We'd have to search through paper records'","Different systems for different data"],"red":["Real-time digital traceability already in place"]}},{"q":"What does a quality escape that reaches a customer actually cost you. total, not just the part?","why":"Forrester's 2023 Tulip-commissioned study found 70% fewer defects. 'Total, not just the part' prompts them to include rework labor, expediting, customer penalties, and reputational cost. all of which are large. Builds ROI fast.","flags":{"green":["Names a number or incident",">$10K per escape is material","Mentions customer penalties or chargebacks"],"red":[]}},{"q":"How are NCRs and CAPAs handled today. paper forms, spreadsheets, or a QMS?","why":"Manual NCR/CAPA = Technical Buyer is your champion and they are frustrated daily. Slow closure rates = regulatory risk they are actively worried about. Short question, high signal.","flags":{"green":["Paper NCRs","Spreadsheet CAPA tracker","Slow closure rates or backlog"],"red":[]}},{"q":"Honest answer. if an auditor walked in tomorrow, how would you feel about your traceability and records?","why":"The 'honest answer' framing disarms the reflex to say 'we'd be fine.' If they hesitate, laugh, or qualify. that's your opening. Fear of audit failure is one of the most powerful purchase motivators in manufacturing.","flags":{"green":["Hesitates or qualifies","Recent audit finding or close call","Upcoming scheduled audit"],"red":["Full confidence + recent clean audit with no gaps expressed"]}}]},{"id":"impl","label":"Implementation Fit","color":"#0284c7","icon":"🚀","subtitle":"Think Big. Start Small. Go Fast. Composable Operations. qualify deployment readiness for the 90-day pilot","questions":[{"q":"Are you thinking about one use case on one line to start, or is this a broader platform initiative?","why":"Framing the choice gives them permission to start small. which lowers risk and speeds the close. One pilot line = fastest path to a win and an expansion story. 'Broader initiative' = larger deal but longer cycle.","flags":{"green":["Start with one use case, prove it, expand","One pilot line or work cell"],"red":["Require full plant rollout before they'll sign. scope and timeline risk"]}},{"q":"Do you have manufacturing engineers or systems engineers on staff who like to build things?","why":"This is the no-code champion question. If they have engineers who want to own their tools, offer the 30-day free trial on the spot. No SI = faster time to value, lower TCO, and a motivated internal champion.","flags":{"green":["Mfg engineers on staff","'Our engineers would love to own this'","Systems engineers or CI team who builds internally"],"red":["No technical staff at all. full SI dependency raises cost and risk"]}},{"q":"What does your IT environment look like. cloud-friendly, or is everything on-prem?","why":"Tulip is cloud-native SaaS on AWS. On-prem-only is a disqualifier unless they accept edge + cloud hybrid. Surface this early. don't let it become a late-stage blocker.","flags":{"green":["Cloud OK","AWS already in use","No strong on-prem requirement"],"red":["Hard on-prem only. potential disqualifier; escalate to AE"]}},{"q":"Is the floor connected. WiFi or Ethernet at stations, or are there dead zones?","why":"Tulip's edge runtime handles offline mode, but connectivity affects deployment planning and device choice. Dead zones = hardware conversation. Tablets already in use = faster deployment.","flags":{"green":["WiFi or wired at stations","Tablets already deployed to operators"],"red":["No floor connectivity. adds infrastructure complexity before go-live"]}},{"q":"What are operators actually touching today. tablets, PCs, shared kiosks, paper?","why":"Closes the implementation section with a practical infrastructure question. Tablets already deployed = shortest path. Paper or shared terminals = device conversation needed. Helps scope the deployment.","flags":{"green":["Tablets already in use","PCs or dedicated screens at workstations"],"red":["Single shared ancient kiosk. IT discussion needed before deployment"]}},{"q":"If you moved forward with something like this, would you expect to use your existing hardware. tablets, screens, terminals, or would new devices be part of the conversation?","why":"Tulip runs on any modern tablet, PC, or browser. no proprietary hardware required. Existing hardware = faster deployment and lower upfront cost. Surfaces CapEx sensitivity and deployment readiness in one question.","flags":{"green":["Already have tablets or screens deployed","Expecting to reuse existing hardware","Bring-your-own-device environment"],"red":["Require proprietary ruggedized hardware only. compatibility check needed","No devices on the floor at all. full hardware procurement required"]}},{"q":"One thing we see make or break implementations is operator adoption. how would you describe your team's openness to new tools? Are operators typically early adopters, or does change tend to meet resistance on your floor?","why":"Adoption risk is the #1 reason implementations stall post-go-live. This question surfaces change management readiness and gives you a chance to position Tulip's operator-first UX, guided onboarding, and the fact that operators typically embrace it because it makes their job easier. not harder.","flags":{"green":["'Our operators are pretty open'","Previous successful digital rollout","Champions on the floor who want change"],"red":["'Our operators resist anything new'","Previous failed implementation due to low adoption","Union environment with strict change rules. flag for AE"]}}]},{"id":"buying","label":"Buying Process & MEDDIC","color":"#0891b2","icon":"💰","subtitle":"Qualify the deal, map the decision, and test for real transformation intent","questions":[{"q":"When a decision like this gets made at your company. who's in the room?","why":"Maps the buying committee without the word 'stakeholders.' You need an economic buyer (VP Ops, CFO) and a champion (Mfg Engineer, End User) at minimum. Their answer tells you whether you're talking to the right person.","flags":{"green":["Small committee: 2–4 people","Economic buyer and champion already identified"],"red":["Procurement-led with no ops champion in the conversation","Committee of 10+. long consensus process"]}},{"q":"Have you looked at anything like this before. MES platforms, floor digitization, or is this new territory?","why":"Prior evaluation = they understand the category. May have evaluation criteria you can map to Tulip's strengths. Surfaces competitive threats and incumbent loyalty early. New territory = education cycle ahead.","flags":{"green":["Previous evaluation. familiar with the space","Looked at a competitor and were disappointed"],"red":["Never evaluated ops tech. longer education cycle likely"]}},{"q":"Is there budget allocated for this already, or would it need to go through a business case?","why":"Budget allocated = fastest cycle. No budget = help them build the ROI model using the Forrester TEI report ($16.23M NPV, 448% ROI). Don't be afraid to offer this. it's the most credible document you have.","flags":{"green":["Budget allocated this cycle","'We have a line item for ops tech'","CapEx or OpEx approved in planning"],"red":["No budget, no path to one in the near term. 6+ month cycle minimum"]}},{"q":"When would you want this live. is there a target date tied to anything?","why":"Timeline = urgency signal and deal velocity indicator. <6 months + tied to an event = high urgency. >12 months = longer cycle. '90 days to deploy' is Tulip's strongest competitive message. use it here.","flags":{"green":["Live within 90 days","Tied to audit, product launch, or contract"],"red":["'Someday' or '2+ years out'. low urgency, nurture and stay warm"]}},{"q":"Six months after go-live. what would a win look like? What would you point to?","why":"The success metric question. Their answer is your proof of value, your AE brief, and your follow-up hook. It also sets evaluation criteria in your favor. Don't suggest an answer. let them define the win.","flags":{"green":["Specific metric: FPY %, downtime hours, audit pass, operator training time"],"red":["'Just better visibility'. vague and hard to prove; push for a number"]}},{"q":"Are we the only people you're talking to, or is there a shortlist forming?","why":"Surfaces competitive threats directly. Casual framing reduces defensiveness. Siemens/SAP on the list = TCO and deploy speed. Paper = urgency play. First mover = set the evaluation criteria now before anyone else does.","flags":{"green":["No shortlist. you're first mover","Evaluated legacy MES and rejected it"],"red":["Already deep into a Siemens or SAP evaluation. harder to displace"]}},{"q":"Last one. when your organization decides to move on something like this, how fast does it actually move? Are you an organization that can go from decision to deployment in 90 days, or does change tend to take longer to work through?","why":"Organizational agility is a real disqualifier. the fastest Tulip deployments happen with orgs that have executive buy-in, a clear champion, and a culture of moving. If they describe 12-committee approvals and 18-month procurement cycles, that's not a bad lead but it needs to be qualified correctly and handed to AE with context.","flags":{"green":["'We move fast when the pain is real'","Executive sponsor in the room","Previous 90-day or sub-6-month technology deployments"],"red":["'Everything takes at least a year here'","Procurement-led with no ops authority","Committee approval required for any technology decision"]}},{"q":"One last thing, and this is the most important question I ask. If you implemented something like Tulip and it quietly disappeared six months later, would anything about how your floor operates actually be different? Or would it go back to the way it was?","why":"Jeff Winter's test: 'If your tech disappeared tomorrow, would anything change?' The best deals are with companies who want to transform behavior, not just deploy software. If they describe actual workflow changes, operator behavior shifts, or decisions they'd make differently. that's a buyer. If they can't answer or say 'probably not much'. that's either a disqualified lead or someone who needs their vision raised before they can champion this internally.","flags":{"green":["Describes specific behavior changes they want to see","Can point to decisions they'd make differently with better data","Has tried and failed to change floor behavior before. frustrated"],"red":["'We just need better reporting'","Can't articulate what 'different' looks like","Sees this as an IT project, not an ops transformation"]}}]},{"id":"fit","label":"Fit Signals & Disqualifiers","color":"#059669","icon":"🎯","subtitle":"Use this to score the deal after the call","scoreItems":[{"label":"50+ operators impacted by the pain","pts":2},{"label":"Paper / spreadsheet / homegrown MES today","pts":2},{"label":"Clear cost or metric attached to the pain","pts":2},{"label":"External forcing function (audit, launch, contract)","pts":2},{"label":"Internal champion identified (mfg eng / plant mgr)","pts":2},{"label":"Budget allocated or in planning cycle","pts":1},{"label":"Regulated environment (FDA, AS9100, ITAR, GxP)","pts":1},{"label":"Mfg engineers or systems engineers on staff","pts":1},{"label":"Multi-site or multi-line opportunity","pts":1},{"label":"Cloud-friendly / no on-prem hard requirement","pts":1}],"redFlags":["Hard on-prem only requirement","No technical staff. full SI dependency","MES contract renewed in last 6 months","No pain expressed. 'we're doing fine'","No budget and no path to one","Single operator, single line. too small","Procurement-only conversation with no ops access"]}],"HUB_TIPS":{"pharma":{"label":"Pharma & Biotech","color":"#a78bfa","icon":"💊","priority_sections":["stack","quality","impl"],"spotlight_qs":["How are your batch records currently managed. paper, hybrid, or electronic?","When FDA walks in, how fast can you pull a complete batch record for a specific lot?","What does your CSV validation process look like. internal team, CRO, or hybrid?","How long does product changeover take, and where does the time go?","Are you under any current 483 observations or have you had regulatory attention recently?"],"tip":"Lead with compliance questions (stack → quality → impl). Get to batch records and audit readiness fast. that's the pain that drives urgency in pharma."},"meddevice":{"label":"Med Device & Diagnostics","color":"#ff5f57","icon":"🩺","priority_sections":["stack","quality","ops"],"spotlight_qs":["How is your DHR currently generated. paper during production, transcribed after, or electronic?","If FDA requested a complete trace of a specific unit shipped last month, how fast could you pull that?","What's your current first pass yield, and where does rework most commonly occur?","What's your CAPA cycle time. FDA QMSR effective Feb 2, 2026 (ISO 13485 now mandatory) from deviation identification to closure?","What QMS are you currently using. Greenlight Guru, MasterControl, ETQ?"],"tip":"DHR and traceability are the entry point. Once you've established their documentation gap, move to quality and then CAPA cycle time. FDA QMSR effective Feb 2, 2026 (ISO 13485 now mandatory). those quantify the cost of doing nothing."},"general":{"label":"General Manufacturing","color":"#f59e0b","icon":"🏭","priority_sections":["ops","stack","quality"],"spotlight_qs":["Walk me through how an operator gets their work instructions today. paper, binder, or screen?","What's your current OEE, and where does most of your loss come from?","When you need to know production status right now, how do you get that information?","What does your shift handoff look like. what context typically gets lost?","What's your current scrap or rework rate, and where in the process does it originate?"],"tip":"For general manufacturing, the ops and stack sections are your primary discovery areas. Get their OEE number and current system. that anchors the ROI conversation."},"aerodefense":{"label":"Aerospace & Defense","color":"#60a5fa","icon":"✈️","priority_sections":["stack","quality","ops"],"spotlight_qs":["How are production travelers and work instructions managed today. paper, PDF, or electronic?","When DCMA auditors request a production record, how long does it take to pull a complete traveler package?","How do you currently ensure operators are always on the current approved work instruction revision?","Do you have any ITAR-controlled technical data on the floor, and how are you managing access controls?","Do you have any open DCMA findings or AS9100 nonconformances related to documentation?"],"tip":"A&D discovery leads with documentation and compliance. DCMA, AS9100, ITAR. Get them to quantify audit prep time and describe their traveler process. That's where the pain lives."}},"PLAYBOOKS":[{"id":"bant","cat":"qualification","name":"BANT","full":"Budget · Authority · Need · Timeline","origin":"IBM, 1950s","stage":"Prospecting → Top of Funnel","when":"Fast top-of-funnel filter. Cold calls, inbound triage. Use to disqualify fast, not qualify deep.","desc":"The oldest qualification framework. Best as a first screen. too shallow for complex enterprise deals. Use to avoid chasing dead ends, then layer CHAMP or MEDDPICC for serious opportunities.","letters":[{"l":"B","n":"Budget","d":"Do they have allocated budget, or do you need to help them build the business case?","q":"Have you set aside budget for shop-floor digitization, or is this something you'd need to build a business case for?"},{"l":"A","n":"Authority","d":"Are you talking to a decision-maker or an influencer? Map the hierarchy.","q":"If we found the right solution, who else would need to be part of the decision?"},{"l":"N","n":"Need","d":"Is there a real, felt pain your solution addresses? Not curiosity. urgency.","q":"What's driving the interest in looking at something like Tulip right now?"},{"l":"T","n":"Timeline","d":"When do they need to solve the problem? Is there a forcing function?","q":"Is there a date driving this. upcoming audit, product launch, new customer requirement?"}],"apply":"On a cold call: run BANT mentally as they talk. Lead with Need (N). budget is often the last thing to confirm. B without a real N is a ghost pipeline.","tip":"BANT was built for mainframes in the '50s. Great pre-filter. Terrible enterprise qualification tool on its own.","color":"#2563eb"},{"id":"champ","cat":"qualification","name":"CHAMP","full":"Challenges · Authority · Money · Prioritization","origin":"Modern consultative sales","stage":"First Discovery Call","when":"Use on first discovery call for manufacturing ops leaders. Buyer-centric. starts with their pain, not your product.","desc":"CHAMP flips BANT by starting with the buyer's challenges, not their budget. Treats the rep as a consultant. Ideal for manufacturing where pain drives urgency before budget exists.","letters":[{"l":"C","n":"Challenges","d":"What operational pains are they living with daily? Surface and deepen them.","q":"Walk me through the most painful part of your current production process. Where do you lose the most time or money?"},{"l":"H","n":"Authority","d":"Who makes the call? Who influences it? Map the decision unit.","q":"Besides yourself, who would be most affected by a change like this, and who would need to sign off?"},{"l":"A","n":"Money","d":"Can they fund it? Will they prioritize budget for this problem?","q":"When you've solved problems like this before, how did you fund that investment?"},{"l":"M","n":"Prioritization","d":"Where does this rank on their list? Is there a forcing function making it urgent?","q":"Of everything on your plate right now, where does fixing this fall? What would make it rise to the top?"}],"apply":"Open every manufacturing discovery call with C: 'Walk me through your biggest pain on the floor right now.' Let the pain set the agenda. not your pitch.","tip":"Manufacturing ops leaders have pain before they have budget. Start with Challenges and you'll earn the right to talk about money.","color":"#059669"},{"id":"anum","cat":"qualification","name":"ANUM","full":"Authority · Need · Urgency · Money","origin":"Ken Krogue, InsideSales.com","stage":"Prospecting → SDR Handoff","when":"High-volume outbound. Pre-qualify before burning AE time. Confirm authority first. everything else is secondary.","desc":"ANUM puts Authority first because talking to the wrong person wastes everyone's time. Built for SDR environments: confirm you have the right contact, then qualify fast and pass upstream.","letters":[{"l":"A","n":"Authority","d":"Confirm decision-making power before investing discovery time.","q":"Are you the right person who'd be involved in evaluating a solution like this for your operations?"},{"l":"N","n":"Need","d":"Is there a real, felt business problem that maps to Tulip?","q":"What's the biggest operational challenge you're trying to solve on the floor right now?"},{"l":"U","n":"Urgency","d":"Is there a timeline or trigger creating real pressure to act?","q":"Is there something making this more pressing right now. an audit, new contract, leadership push?"},{"l":"M","n":"Money","d":"Can they fund a solution? Have they bought similar things before?","q":"Have you made investments in other shop-floor systems recently, or would this be a new budget category?"}],"apply":"On cold calls: 'Are you involved in decisions around manufacturing ops tech?' Confirms A. Then move to N. Don't pitch until you have both.","tip":"ANUM is your SDR filter. Confirm authority before you invest discovery time. Don't let enthusiasm substitute for authority.","color":"#7c3aed"},{"id":"neat","cat":"qualification","name":"N.E.A.T.","full":"Need · Economic Impact · Access to Authority · Timeline","origin":"Harris Consulting Group. built for complex B2B SaaS","stage":"Discovery → Proposal","when":"When you need to build a quantified business case. Forces you to price the pain, not just name it.","desc":"NEAT upgrades BANT by requiring you to quantify economic impact, not just confirm need. 'Access to Authority' acknowledges that you usually work through a champion to reach the Economic Buyer.","letters":[{"l":"N","n":"Need","d":"Core needs. technical and personal. What does the buyer actually need, not just what they say they want?","q":"What's the operational problem you're solving, and what's it cost you every month you don't fix it?"},{"l":"E","n":"Economic Impact","d":"Don't just identify pain. price it. Buyers need a number to build a business case.","q":"If you fixed the defect rate / downtime / paper problem, what would that be worth in dollars or hours per week? [Anchor: 448% ROI, $16.23M NPV]"},{"l":"A","n":"Access to Authority","d":"Can your champion facilitate a meeting with the Economic Buyer? Access ≠ knowing who it is.","q":"Who would need to approve an investment like this, and is that a conversation you'd be comfortable facilitating?"},{"l":"T","n":"Timeline","d":"Is there a real, compelling timeline with consequences for missing it?","q":"What happens if this isn't solved by [date]? Is there a forcing function. audit, product launch, contract renewal?"}],"apply":"Use Forrester TEI ($16.23M NPV, 448% ROI, <6mo payback) to anchor Economic Impact. Give them the number before they have to imagine it.","tip":"NEAT's E letter is where Tulip's ROI data dominates. Quantify early. A deal without a dollar value is a conversation, not an opportunity.","color":"#0891b2"},{"id":"faint","cat":"qualification","name":"FAINT","full":"Funds · Authority · Interest · Need · Timing","origin":"Mike Schultz, RAIN Group","stage":"Prospecting → Discovery","when":"Prospects without a pre-defined budget. Classic for manufacturing companies exploring digitization for the first time.","desc":"FAINT recognizes that great prospects often don't have budget yet, but they have funds. Your job is to build the business case that creates the budget, not wait for one to exist.","letters":[{"l":"F","n":"Funds","d":"Do they have financial capacity, even without a formal budget line?","q":"Have you made operational investments recently. automation, ERP upgrades. at a similar scale?"},{"l":"A","n":"Authority","d":"Are you talking to or can you reach a decision-maker?","q":"Who would be the key stakeholder you'd want us to build a business case for?"},{"l":"I","n":"Interest","d":"Are they genuinely curious, or just being polite? Test their engagement.","q":"What triggered your interest in looking at this now. what changed?"},{"l":"N","n":"Need","d":"Is the pain real and meaningful, even if not yet urgent?","q":"How are you managing [process] today, and what's the frustration level on your team?"},{"l":"T","n":"Timing","d":"Can you create a timeline around a real event or initiative?","q":"Is there anything on the horizon. audit, contract renewal, new product launch. that would make timing relevant?"}],"apply":"When they say 'we don't have budget': 'Totally fine. most great projects start that way. Can I show you what the ROI typically looks like so you can make a case internally?'","tip":"Manufacturing companies often have capital but no MES budget line yet. FAINT lets you sell before they're formally in buying mode.","color":"#e11d48"},{"id":"meddic","cat":"qualification","name":"MEDDIC","full":"Metrics · Economic Buyer · Decision Criteria · Decision Process · Identify Pain · Champion","origin":"Dick Dunkel, PTC, 1996. grew PTC from $300M to $1B in 4 years","stage":"Discovery → Close","when":"Any qualified opportunity with multiple stakeholders. The foundation. Score every deal against all 6 letters.","desc":"The gold standard for complex B2B SaaS. 73% of SaaS companies over $100K ACV use it. Improves win rates 18% and deal sizes 24%. Champion is the single most predictive element. without one, deals stall.","letters":[{"l":"M","n":"Metrics","d":"Quantifiable value tied to what the buyer reports upward.","q":"What KPIs does your VP/COO care about most? [Tulip: 448% ROI, 70% fewer defects, $318K vendor savings, 15% labor productivity]"},{"l":"E","n":"Economic Buyer","d":"The person with final budget authority. Not always who you're talking to.","q":"Who has final authority to approve the budget for a project like this? What does their scorecard look like?"},{"l":"D","n":"Decision Criteria","d":"Formal and informal requirements used to evaluate vendors.","q":"When you evaluate a vendor, what are the top 3 things that have to be true to move forward?"},{"l":"D","n":"Decision Process","d":"The exact steps from evaluation to signed contract.","q":"Walk me through how a decision like this gets made. from evaluation to purchase order. Who's involved at each step?"},{"l":"I","n":"Identify Pain","d":"Specific, felt, consequential pain with a dollar cost.","q":"What's the single operational problem that, if solved, would have the biggest impact? What's it cost you?"},{"l":"C","n":"Champion","d":"Internal advocate with power, influence, and personal motivation.","q":"Who on your team would benefit most from this project succeeding, and would they go to bat for it with leadership?"}],"apply":"After every call, score your deal 0-6. Missing Champion = will stall. Missing Metrics = will lose on price. Use the MEDDPICC Scorecard in Tools to track this.","tip":"Test your champion: ask them to do something (set up a call, share a doc, intro the EB). If they act, they're real. If they stall, they're a coach, not a champion.","color":"#25
